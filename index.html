<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احلام | نظام إدارة المكتبة والحجز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#000000; --ink2:#0a0a0a; --ink3:#000000; --line:rgba(201,161,90,.6);
  --parch:#000000; --parch2:#050505; --parch3:#0d0d0d; --lineL:rgba(201,161,90,.45);
  --brass:#C9A15A; --brass-d:#A9843F; --brass-l:#E2C892;
  --ink-soft:#d4b773; --text-d:#E2C892; --text-m:#d4b773; --text-mL:#burgundy;
  --green:#3E7A5B; --red:#B4483A; --amber:#C9A15A;
  --r:14px; --rs:9px;
  --shadow: 0 10px 30px rgba(0,0,0,.65);
  --shadowL: 0 8px 24px rgba(201,161,90,.12);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'IBM Plex Sans Arabic',sans-serif; background:#000; color:var(--text-d); direction:rtl;}
h1,h2,h3,.serif{font-family:'Amiri',serif;}
button{font-family:inherit; cursor:pointer; border:none;}
input,select,textarea{font-family:inherit; direction:rtl;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--brass-l);}
.num{font-variant-numeric:tabular-nums; letter-spacing:.02em;}
img{max-width:100%;}
.scrollx{overflow-x:auto;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--lineL);border-radius:8px;}

/* ---------- shared bits ---------- */
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:14.5px;transition:.15s;}
.btn-brass{background:linear-gradient(180deg,var(--brass-l),var(--brass));color:#241a05;box-shadow:0 6px 16px rgba(169,132,63,.35);}
.btn-brass:hover{filter:brightness(1.06);transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1.5px solid var(--lineL);color:var(--text-d);}
.btn-ghost:hover{border-color:var(--brass-d);}
.btn-ghost-dark{background:transparent;border:1.5px solid var(--line);color:#EDEBE4;}
.btn-ghost-dark:hover{border-color:var(--brass);}
.btn-dark{background:var(--ink3);color:#fff;}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:999px;}
.btn-danger{background:rgba(180,72,58,.12);color:var(--red);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.badge-amber{background:rgba(201,161,90,.16);color:#8a6a26;}
.badge-green{background:rgba(62,122,91,.14);color:var(--green);}
.badge-red{background:rgba(180,72,58,.13);color:var(--red);}
.badge-gray{background:rgba(107,114,128,.14);color:#565c68;}
.badge-blue{background:rgba(60,90,160,.13);color:#3c5aa0;}

/* ============ CUSTOMER SITE (warm/parchment theme) ============ */
.site{min-height:100vh;background:
  radial-gradient(900px 420px at 85% -10%, rgba(201,161,90,.14), transparent),
  var(--parch);}
.topbar{position:sticky;top:0;z-index:40;background:rgba(247,243,234,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--lineL);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--brass-l);font-family:'Amiri',serif;font-size:20px;}
.brand-name{font-family:'Amiri',serif;font-weight:700;font-size:21px;}
.brand-tag{font-size:11px;color:var(--text-m);margin-top:-2px;}
.nav-links{display:flex;gap:6px;align-items:center;}
.nav-link{padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text-m);}
.nav-link.active,.nav-link:hover{background:var(--parch3);color:var(--text-d);}

.hero{padding:64px 0 44px;}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;}
.eyebrow{font-size:12.5px;letter-spacing:.14em;color:var(--brass-d);font-weight:700;margin-bottom:14px;}
.hero h1{font-size:44px;line-height:1.28;font-weight:700;margin-bottom:16px;}
.hero p.lead{font-size:16.5px;color:var(--text-m);line-height:1.85;max-width:46ch;margin-bottom:28px;}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;}

.quiet-meter{background:var(--parch2);border:1px solid var(--lineL);border-radius:var(--r);padding:22px;box-shadow:var(--shadowL);}
.qm-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.qm-title{font-size:13px;color:var(--text-m);font-weight:600;}
.qm-count{font-family:'Amiri',serif;font-size:30px;font-weight:700;}
.qm-count small{font-size:14px;font-weight:400;color:var(--text-m);}
.seat-dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:10px;}
.seat-dot{aspect-ratio:1;border-radius:5px;background:var(--parch3);}
.seat-dot.free{background:linear-gradient(160deg,#dff0e6,#c9e6d5);}
.seat-dot.busy{background:linear-gradient(160deg,var(--brass-l),var(--brass));}
.seat-dot.off{background:repeating-linear-gradient(45deg,#eee,#eee 3px,#e2e2e2 3px,#e2e2e2 6px);}
.qm-legend{display:flex;gap:16px;font-size:12px;color:var(--text-m);}
.qm-legend span{display:flex;align-items:center;gap:5px;}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;}

.section{padding:46px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;}
.section-head h2{font-size:26px;}
.section-head p{color:var(--text-m);font-size:14px;margin-top:4px;}

.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.price-card{background:var(--parch2);border:1px solid var(--lineL);border-radius:var(--r);padding:20px;text-align:center;transition:.15s;}
.price-card:hover{border-color:var(--brass);transform:translateY(-2px);box-shadow:var(--shadowL);}
.price-card .lbl{font-size:13.5px;color:var(--text-m);margin-bottom:8px;font-weight:600;}
.price-card .val{font-family:'Amiri',serif;font-size:26px;font-weight:700;}
.price-card .val small{font-size:13px;font-weight:400;color:var(--text-m);}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.prod-card{background:var(--parch2);border:1px solid var(--lineL);border-radius:var(--r);padding:16px;text-align:center;}
.prod-emoji{font-size:34px;margin-bottom:8px;}
.prod-name{font-weight:600;font-size:14.5px;}
.prod-price{color:var(--brass-d);font-weight:700;margin-top:4px;}

.card-plain{background:var(--parch2);border:1px solid var(--lineL);border-radius:var(--r);padding:26px;box-shadow:var(--shadowL);}
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:13px;font-weight:600;color:var(--text-m);margin-bottom:6px;}
.form-row input,.form-row select,.form-row textarea,
.input-dark{width:100%;padding:11px 13px;border-radius:var(--rs);border:1.5px solid var(--brass);font-size:14.5px;background:#111;color:var(--brass-l);box-shadow:inset 0 0 0 1px rgba(201,161,90,.12);}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus,.input-dark:focus{outline:none;border-color:var(--brass);background:#111;color:var(--brass-l);box-shadow:0 0 0 2px rgba(201,161,90,.18);}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dur-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.dur-opt{border:1.5px solid var(--lineL);border-radius:var(--rs);padding:12px;text-align:center;cursor:pointer;}
.dur-opt.sel{border-color:var(--brass);background:rgba(201,161,90,.08);}
.dur-opt .l{font-size:13px;color:var(--text-m);font-weight:600;}
.dur-opt .p{font-family:'Amiri',serif;font-weight:700;font-size:18px;margin-top:3px;}
.price-total{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:var(--rs);padding:18px 20px;margin:20px 0;}
.price-total .t{font-size:13px;color:#c9cbd3;}
.price-total .v{font-family:'Amiri',serif;font-size:26px;font-weight:700;color:var(--brass-l);}

footer.site-footer{border-top:1px solid var(--lineL);padding:30px 0;margin-top:40px;color:var(--text-m);font-size:13px;text-align:center;}

/* ============ ADMIN (dark ink theme) ============ */
.admin{min-height:100vh;background:var(--ink);color:#EDEBE4;display:flex;}
.sidebar{width:246px;flex-shrink:0;background:var(--ink2);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;}
.sb-brand{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
.sb-brand .brand-mark{background:var(--brass);color:var(--ink);}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;color:#B7BAC4;margin-bottom:2px;font-weight:500;}
.sb-item .ic{width:18px;text-align:center;}
.sb-item:hover{background:var(--ink3);color:#fff;}
.sb-item.active{background:linear-gradient(90deg,rgba(201,161,90,.16),transparent);color:var(--brass-l);border-right:2.5px solid var(--brass);}
.sb-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);}
.sb-foot b{color:#EDEBE4;display:block;font-size:13.5px;}
.admin-main{flex:1;min-width:0;}
.admin-top{position:sticky;top:0;z-index:20;background:rgba(20,23,31,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;}
.admin-top h1{font-size:19px;font-weight:700;font-family:'IBM Plex Sans Arabic';}
.admin-top p{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.admin-body{padding:26px 28px 60px;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.kpi{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;}
.kpi .l{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
.kpi .v{font-family:'Amiri',serif;font-size:27px;font-weight:700;}
.kpi .v small{font-size:13px;color:var(--ink-soft);font-weight:400;}
.kpi .bar{position:absolute;bottom:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--brass),transparent);}

.panel{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px;}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.panel-h h3{font-size:16px;font-weight:700;}
.panel-h .sub{font-size:12.5px;color:var(--ink-soft);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:right;color:var(--ink-soft);font-weight:600;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tr:hover td{background:rgba(255,255,255,.02);}
.site table th{color:var(--text-m);border-bottom:1px solid var(--lineL);}
.site table td{border-bottom:1px solid var(--lineL);}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.input-dark{background:#111;border:1px solid var(--brass);color:var(--brass-l);border-radius:9px;padding:9px 13px;font-size:13.5px;}
.input-dark::placeholder{color:rgba(226,200,146,.7);}
select.input-dark option{background:#111;color:var(--brass-l);}

/* keep overall design unchanged, just field backgrounds */
#app .login-wrap,
#app .login-card,
#app .form-row input,
#app .form-row select,
#app .form-row textarea,
#app .input-dark{background:#111 !important;color:var(--brass-l) !important;border-color:var(--brass) !important;}
.chip-filter{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:7px 14px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);color:var(--ink-soft);}
.chip.on{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:700;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr;} .hero-grid{grid-template-columns:1fr;} .form-grid2{grid-template-columns:1fr;}}

.seat-grid-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;}
.seat-tile{border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;background:var(--ink3);}
.seat-tile .code{font-family:'Amiri',serif;font-weight:700;font-size:16px;}
.seat-tile .st{font-size:10.5px;margin-top:4px;display:block;}
.seat-tile.free{border-color:rgba(62,122,91,.4);}
.seat-tile.busy{border-color:var(--brass);background:rgba(201,161,90,.09);}
.seat-tile.off{opacity:.5;}

.modal-bg{position:fixed;inset:0;background:rgba(10,10,14,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;color:#EDEBE4;}
.modal.light{background:var(--parch2);color:var(--text-d);border-color:var(--lineL);}
.modal h3{font-size:17px;margin-bottom:16px;}
.modal-close{position:absolute;}
.stack{display:flex;flex-direction:column;gap:10px;}

.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.site .empty{color:var(--text-m);}
.empty .ic{font-size:30px;margin-bottom:8px;}

.notif-item{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);}
.notif-item .ic{width:34px;height:34px;border-radius:9px;background:var(--ink3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.notif-item .t{font-size:13.5px;} .notif-item .ts{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.notif-item.unread{background:rgba(201,161,90,.05);}
.bell-btn{position:relative;}
.bell-dot{position:absolute;top:-2px;left:-2px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid var(--ink2);}

.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{padding:10px 16px;font-size:13.5px;color:var(--ink-soft);font-weight:600;border-bottom:2px solid transparent;}
.tab-btn.on{color:var(--brass-l);border-color:var(--brass);}

.profile-hero{display:flex;gap:18px;align-items:center;background:linear-gradient(120deg,var(--ink3),var(--ink2));border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px;}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--brass);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-weight:700;font-size:22px;flex-shrink:0;}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;}
.mini-stat{background:var(--ink3);border-radius:10px;padding:12px;text-align:center;}
.mini-stat .v{font-family:'Amiri',serif;font-weight:700;font-size:19px;color:var(--brass-l);}
.mini-stat .l{font-size:11px;color:var(--ink-soft);margin-top:2px;}

.site .mini-stat{background:var(--parch3);}
.site .mini-stat .v{color:var(--brass-d);}
.site .profile-hero{background:linear-gradient(120deg,#fff,var(--parch3));border-color:var(--lineL);}

.toast-wrap{position:fixed;bottom:22px;left:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;border:1px solid var(--brass);padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);animation:up .2s ease;}
@keyframes up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.pin-boxes{display:flex;gap:8px;justify-content:center;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top, rgba(201,161,90,.12), transparent 28%), #000;}
.login-card{background:#000;border:1px solid var(--brass);border-radius:18px;padding:36px;width:100%;max-width:380px;color:var(--brass-l);box-shadow:0 18px 40px rgba(0,0,0,.7);}

/* ============ MOBILE RESPONSIVE ADMIN ============ */
.hamburger-btn{display:none;width:38px;height:38px;border-radius:9px;background:var(--ink3);color:#EDEBE4;font-size:18px;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar-overlay{display:none;}
@media(max-width:900px){
  .admin{display:block;}
  .sidebar{
    position:fixed; top:0; right:0; bottom:0; height:100vh; width:80vw; max-width:300px;
    transform:translateX(100%); transition:transform .25s ease; z-index:90;
    box-shadow:-10px 0 34px rgba(0,0,0,.45);
  }
  .sidebar.open{ transform:translateX(0); }
  .admin-main{width:100%;}
  .admin-top{padding:14px 16px;}
  .admin-body{padding:16px 14px 50px;}
  .hamburger-btn{display:inline-flex;}
  .sidebar-overlay.show{display:block;position:fixed;inset:0;background:rgba(8,9,13,.55);z-index:80;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .mini-stats{grid-template-columns:repeat(2,1fr);}
  .panel{padding:16px;}
  .admin-top h1{font-size:16.5px;}
  .admin-top p{display:none;}
  table{font-size:12.5px;}
  th,td{padding:9px 8px;}
  .toolbar{gap:8px;}
  .modal{padding:20px;}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .kpi .v{font-size:22px;}
  .seat-grid-admin{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastWrap" class="toast-wrap"></div>

<script>
/* ============================================================
   مكتبتي — Maktabati Library Management System
   Single-file app using Supabase (Postgres) as the real persisted DB
   ============================================================ */

const SUPABASE_URL = 'https://mzfxkwntfsczbdvwhepl.supabase.co';
const SUPABASE_KEY = 'sb_publishable__jV8Hqgs4qVZ3-3crpsKTw_HFH5J5m3';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STORAGE_KEY = 'maktabati_db_v1'; // kept as a local emergency backup key only
let DB = null;
let UI = {
  site: 'admin', // system is admin-only now — no public customer site
  mobileNavOpen: false,
  customerPage: 'home', // home | booking | account (kept for internal reuse only)
  bookingDraft: { date:'', time:'', durationId:'', people:1, seatId:'' },
  identStep: null, // when finishing a booking that needs identification
  customerAuthPhone: null, // logged-in customer on site
  adminAuthed: false,
  adminStaff: null,
  adminPage: 'dashboard',
  analyticsPeriod: 'week',
  customFrom:'', customTo:'',
  custSearch:'', custFilter:'all',
  bookSearch:'', bookFilter:'all',
  reportTab:'visitors',
  modal: null, // {type,...}
};

function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowTimeHM(){ let d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtMoney(n){ return (Math.round(n*100)/100).toLocaleString('en-US')+' '+(DB&&DB.settings?DB.settings.currency:'ج.س'); }
function fmtDate(iso){ if(!iso) return '—'; let d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDT(iso){ if(!iso) return '—'; let d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- default seed data ---------------- */
function defaultDB(){
  return {

async function loadDB(){
  try{
    const { data, error } = await sb.from('app_state').select('data').eq('id',1).single();
    if(error && error.code!=='PGRST116') throw error; // PGRST116 = no row found yet
    if(data && data.data && Object.keys(data.data).length){ DB = data.data; ensureShape(); return; }
  }catch(e){
    console.error('Supabase load failed', e);
    toast('تعذر الاتصال بقاعدة البيانات، تحقق من الإنترنت','err');
  }
  DB = defaultDB();
  await persist();
}
function ensureShape(){
  const d = defaultDB();
  for(const k in d){ if(!(k in DB)) DB[k]=d[k]; }
  if(!DB.settings.overtimeRate) DB.settings.overtimeRate = 12;
  if(DB.settings.currency==='ر.س') DB.settings.currency='ج.س'; // migrate old currency to Sudanese Pound
}
let saving=false, saveQueued=false;
async function persist(){
  if(saving){ saveQueued=true; return; }
  saving=true;
  try{
    const { error } = await sb.from('app_state').upsert({ id:1, data:DB, updated_at:new Date().toISOString() });
    if(error) throw error;
  }catch(e){
    console.error('Supabase save failed', e);
    toast('تعذر حفظ البيانات على قاعدة البيانات، حاول مرة أخرى','err');
  }
  saving=false;
  if(saveQueued){ saveQueued=false; persist(); }
}
async function save(){ await persist(); render(); }

function toast(msg,kind){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  if(kind==='err') el.style.borderColor='#B4483A';
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
function addNotif(type,message){
  DB.notifications.unshift({id:uid('nt'),type,message,createdAt:new Date().toISOString(),read:false});
  DB.notifications = DB.notifications.slice(0,300);
}

/* ---------------- derived helpers ---------------- */
function seatStatusNow(seatId){
  const seat = DB.seats.find(s=>s.id===seatId);
  if(!seat) return 'available';
  if(seat.status==='maintenance') return 'maintenance';
  const active = DB.checkins.find(c=>c.seatId===seatId && c.status==='active');
  return active ? 'occupied' : 'available';
}
function seatLabel(status){ return {available:'متاح',occupied:'مستخدم حالياً',maintenance:'غير متاح',reserved:'محجوز'}[status]||status; }
function availableSeatsCount(){ return DB.seats.filter(s=>seatStatusNow(s.id)==='available').length; }
function currentlyInside(){ return DB.checkins.filter(c=>c.status==='active'); }
function getCustomer(phone){ return DB.customers[phone]; }
function upsertCustomer(phone,name,email){
  if(!DB.customers[phone]){
    DB.customers[phone]={phone,name,email:email||'',firstVisit:new Date().toISOString(),visits:0,totalHours:0,totalSpent:0,lastVisit:null};
  } else if(name){ DB.customers[phone].name=name; if(email) DB.customers[phone].email=email; }
  return DB.customers[phone];
}
function durationById(id){ return DB.settings.durations.find(d=>d.id===id); }
function isSameDay(iso,dateStr){ return iso && iso.slice(0,10)===dateStr; }
function inLastDays(iso,days){ return (Date.now()-new Date(iso).getTime()) <= days*86400000; }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+1)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }

function periodRange(period){
  const now=new Date(); let from,to=now;
  if(period==='today'){ from=new Date(now); from.setHours(0,0,0,0); }
  else if(period==='week'){ from=startOfWeek(now); }
  else if(period==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); }
  else if(period==='3m'){ from=new Date(now); from.setMonth(from.getMonth()-3); }
  else if(period==='6m'){ from=new Date(now); from.setMonth(from.getMonth()-6); }
  else if(period==='year'){ from=new Date(now.getFullYear(),0,1); }
  else if(period==='custom'){ from = UI.customFrom? new Date(UI.customFrom):new Date(0); to = UI.customTo? new Date(UI.customTo+'T23:59:59'):now; }
  else { from=new Date(0); }
  return {from,to};
}
function inRange(iso,range){ const t=new Date(iso).getTime(); return t>=range.from.getTime() && t<=range.to.getTime(); }

/* ---------------- Dashboard ---------------- */
function pgDashboard(){
  const now=new Date();
  const visitsToday = DB.checkins.filter(c=>isSameDay(c.entryAt,todayISO())).length;
  const weekRange = periodRange('week'); const monthRange=periodRange('month');
  const visitsWeek = DB.checkins.filter(c=>inRange(c.entryAt,weekRange)).length;
  const visitsMonth = DB.checkins.filter(c=>inRange(c.entryAt,monthRange)).length;
  const bookingsToday = DB.bookings.filter(b=>b.date===todayISO()).length;
  const upcoming = DB.bookings.filter(b=>b.date>todayISO() && b.status!=='Cancelled').length;
  const revToday = revenueInRange({from:new Date(new Date().setHours(0,0,0,0)),to:now});
  const revWeek = revenueInRange(weekRange);
  const revMonth = revenueInRange(monthRange);
  const productSales = DB.orders.reduce((s,o)=>s+o.total,0);
  const totalExpenses = (DB.expenses || []).reduce((s,e)=>s + Number(e.amount || 0), 0);
  const netProfit = (revMonth + productSales) - totalExpenses;
  const usageHours = DB.checkins.filter(c=>c.status==='completed').reduce((s,c)=>s+(c.actualHours||0),0);
  const occRate = DB.seats.length? Math.round((currentlyInside().length/DB.seats.length)*100):0;

  const topProducts = [...DB.products].sort((a,b)=>b.sold-a.sold).slice(0,5);

  return `
  <div class="kpi-grid">
    ${kpi('زوار اليوم', visitsToday)}
    ${kpi('زوار هذا الأسبوع', visitsWeek)}
    ${kpi('زوار هذا الشهر', visitsMonth)}
    ${kpi('الموجودون حالياً', currentlyInside().length)}
    ${kpi('حجوزات اليوم', bookingsToday)}
    ${kpi('حجوزات قادمة', upcoming)}
    ${kpi('إيرادات اليوم', fmtMoney(revToday))}
    ${kpi('إيرادات الأسبوع', fmtMoney(revWeek))}
    ${kpi('إيرادات الشهر', fmtMoney(revMonth))}
    ${kpi('مبيعات المنتجات', fmtMoney(productSales))}
    ${kpi('المصروفات', fmtMoney(totalExpenses))}
    ${kpi('صافي الربح', fmtMoney(netProfit))}
    ${kpi('ساعات الاستخدام', Math.round(usageHours))}
    ${kpi('نسبة إشغال المقاعد', occRate+'%')}
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h3>الإيرادات آخر 7 أيام</h3></div><canvas id="chartRevenue" height="180"></canvas></div>
    <div class="panel"><div class="panel-h"><h3>المنتجات الأكثر مبيعاً</h3></div>
      ${topProducts.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);"><span>${p.emoji} ${esc(p.name)}</span><span class="badge badge-amber num">${p.sold} مباع</span></div>`).join('') || '<div class="empty">لا توجد مبيعات بعد</div>'}
    </div>
  </div>
  <div class="panel"><div class="panel-h"><h3>أحدث الحجوزات</h3><div style="display:flex;gap:8px;"><button class="btn btn-brass btn-sm" onclick="App.openNewBooking()">+ حجز جديد</button><a class="btn btn-ghost-dark btn-sm" onclick="App.goAdminPage('bookings')">عرض الكل</a></div></div>
    ${bookingTable(DB.bookings.slice(-6).reverse())}
  </div>`;
}
function kpi(label,val){ return `<div class="kpi"><div class="l">${label}</div><div class="v num">${val}</div><div class="bar"></div></div>`; }
function revenueInRange(range){
  const bookingRev = DB.checkins.filter(c=>c.status==='completed' && inRange(c.exitAt,range)).reduce((s,c)=>s+(c.finalPrice||0),0);
  const posRev = DB.orders.filter(o=>inRange(o.createdAt,range)).reduce((s,o)=>s+o.total,0);
  return bookingRev+posRev;
}
function drawDashboardCharts(){
  const el=document.getElementById('chartRevenue'); if(!el||!window.Chart) return;
  const labels=[], data=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const iso=d.toISOString().slice(0,10);
    labels.push(d.toLocaleDateString('en-GB',{weekday:'short'}));
    const dayRange={from:new Date(iso+'T00:00:00'),to:new Date(iso+'T23:59:59')};
    data.push(revenueInRange(dayRange));
  }
  if(el._chart) el._chart.destroy();
  el._chart = new Chart(el,{type:'bar',data:{labels,datasets:[{data,backgroundColor:'#C9A15A',borderRadius:6,maxBarThickness:34}]},
    options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#8A8F9C'}},y:{grid:{color:'rgba(255,255,255,.06)'},ticks:{color:'#8A8F9C'}}}}});
}

App.doCheckout=(ciId)=>{
  const c=DB.checkins.find(x=>x.id===ciId); if(!c) return;
  const elapsedH=(Date.now()-new Date(c.entryAt).getTime())/3600000;
  const overHours=Math.max(0,elapsedH-c.plannedHours);
  const finalPrice=c.plannedPrice+Math.ceil(overHours)*DB.settings.overtimeRate;
  c.exitAt=new Date().toISOString(); c.actualHours=elapsedH; c.finalPrice=finalPrice; c.status='completed';
  if(c.bookingId){ const b=DB.bookings.find(x=>x.id===c.bookingId); if(b) b.status='Completed'; }
  const cust=upsertCustomer(c.customerPhone,c.customerName);
  cust.visits+=1; cust.totalHours+=elapsedH; cust.totalSpent+=finalPrice; cust.lastVisit=c.exitAt;
  addNotif('checkout','تسجيل خروج: '+c.customerName+' — '+fmtMoney(finalPrice));
  UI.modal=null; save();
};

/* ---------------- Customers ---------------- */
function pgCustomers(){
  let list=Object.values(DB.customers);
  if(UI.custSearch) list=list.filter(c=>c.name.includes(UI.custSearch)||c.phone.includes(UI.custSearch));
  if(UI.custFilter==='new') list=list.filter(c=>inLastDays(c.firstVisit,30) && c.visits<=1);
  if(UI.custFilter==='repeat') list=list.filter(c=>c.visits>1);
  if(UI.custFilter==='mostVisits') list=[...list].sort((a,b)=>b.visits-a.visits).slice(0,15);
  if(UI.custFilter==='mostSpend') list=[...list].sort((a,b)=>b.totalSpent-a.totalSpent).slice(0,15);
  if(UI.custFilter==='inactive') list=list.filter(c=>c.lastVisit && !inLastDays(c.lastVisit,30));
  if(UI.custFilter==='all') list=[...list].sort((a,b)=>new Date(b.firstVisit)-new Date(a.firstVisit));
  const filters=[['all','الكل'],['new','عميل جديد'],['repeat','عميل متكرر'],['mostVisits','الأكثر زيارة'],['mostSpend','الأكثر إنفاقاً'],['inactive','لم يزر منذ فترة']];
  return `<div class="panel">
    <div class="toolbar">
      <input class="input-dark" placeholder="بحث بالاسم أو رقم الجوال…" value="${esc(UI.custSearch)}" oninput="App.setCustSearch(this.value)">
      <div class="chip-filter">${filters.map(f=>`<span class="chip ${UI.custFilter===f[0]?'on':''}" onclick="App.setCustFilter('${f[0]}')">${f[1]}</span>`).join('')}</div>
    </div>
    ${list.length?`<div class="scrollx"><table><thead><tr><th>الاسم</th><th>الجوال</th><th>عدد الزيارات</th><th>إجمالي الساعات</th><th>آخر زيارة</th><th>إجمالي الإنفاق</th><th></th></tr></thead><tbody>
      ${list.map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${esc(c.phone)}</td><td class="num">${c.visits}</td><td class="num">${Math.round(c.totalHours)}</td><td>${fmtDate(c.lastVisit)}</td><td class="num">${fmtMoney(c.totalSpent)}</td><td><button class="btn btn-ghost-dark btn-sm" onclick="App.openCustomer('${c.phone}')">التفاصيل</button></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty"><div class="ic">☺</div>لا يوجد عملاء مطابقون</div>'}
  </div>`;
}

};

/* ---------------- Analytics ---------------- */
function pgAnalytics(){
  const range=periodRange(UI.analyticsPeriod);
  const cins = DB.checkins.filter(c=>inRange(c.entryAt,range));
  const completed = cins.filter(c=>c.status==='completed');
  const totalVisitors = cins.length;
  const phonesInRange = [...new Set(cins.map(c=>c.customerPhone))];
  const newCustomers = phonesInRange.filter(ph=>{ const c=DB.customers[ph]; return c && inRange(c.firstVisit,range); }).length;
  const returning = phonesInRange.length-newCustomers;
  const avgVisitsPerCustomer = phonesInRange.length? (totalVisitors/phonesInRange.length).toFixed(1):0;
  const avgDuration = completed.length? (completed.reduce((s,c)=>s+c.actualHours,0)/completed.length).toFixed(1):0;
  const totalUsageHours = completed.reduce((s,c)=>s+c.actualHours,0);
  const rev = revenueInRange(range);
  const avgSpend = phonesInRange.length? (rev/phonesInRange.length).toFixed(0):0;
  const dayCounts=[0,0,0,0,0,0,0]; const hourCounts=Array(24).fill(0);
  cins.forEach(c=>{ const d=new Date(c.entryAt); dayCounts[d.getDay()]++; hourCounts[d.getHours()]++; });
  const dayNames=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const busiestDay = dayNames[dayCounts.indexOf(Math.max(...dayCounts))];
  const busiestHour = hourCounts.indexOf(Math.max(...hourCounts));
  const periods=[['today','اليوم'],['week','الأسبوع'],['month','الشهر'],['3m','3 أشهر'],['6m','6 أشهر'],['year','السنة'],['custom','فترة مخصصة']];
  return `
  <div class="toolbar">
    <div class="chip-filter">${periods.map(p=>`<span class="chip ${UI.analyticsPeriod===p[0]?'on':''}" onclick="App.setAnalyticsPeriod('${p[0]}')">${p[1]}</span>`).join('')}</div>
    ${UI.analyticsPeriod==='custom'?`<input type="date" class="input-dark" value="${UI.customFrom}" onchange="App.setCustomFrom(this.value)"> إلى <input type="date" class="input-dark" value="${UI.customTo}" onchange="App.setCustomTo(this.value)">`:''}
  </div>
  <div class="kpi-grid">
    ${kpi('إجمالي الزوار', totalVisitors)}
    ${kpi('عملاء جدد', newCustomers)}
    ${kpi('عملاء عائدون', returning)}
    ${kpi('متوسط الزيارات للعميل', avgVisitsPerCustomer)}
    ${kpi('متوسط مدة الزيارة (س)', avgDuration)}
    ${kpi('إجمالي ساعات الاستخدام', Math.round(totalUsageHours))}
    ${kpi('متوسط إنفاق العميل', fmtMoney(avgSpend))}
    ${kpi('أكثر يوم ازدحاماً', busiestDay)}
    ${kpi('أكثر ساعة ازدحاماً', busiestHour+':00')}
  </div>
  <div class="panel"><div class="panel-h"><h3>الزيارات حسب أيام الأسبوع</h3></div><canvas id="chartAnalytics" height="170"></canvas></div>`;
}
App.setAnalyticsPeriod=(p)=>{UI.analyticsPeriod=p; render();};
App.setCustomFrom=(v)=>{UI.customFrom=v; render();};
App.setCustomTo=(v)=>{UI.customTo=v; render();};
function drawAnalyticsChart(){
  const el=document.getElementById('chartAnalytics'); if(!el||!window.Chart) return;
  const range=periodRange(UI.analyticsPeriod);
  const cins=DB.checkins.filter(c=>inRange(c.entryAt,range));
  const dayNames=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const counts=[0,0,0,0,0,0,0];
  cins.forEach(c=>counts[new Date(c.entryAt).getDay()]++);
  if(el._chart) el._chart.destroy();
  el._chart=new Chart(el,{type:'bar',data:{labels:dayNames,datasets:[{data:counts,backgroundColor:'#C9A15A',borderRadius:6}]},
    options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#8A8F9C'}},y:{grid:{color:'rgba(255,255,255,.06)'},ticks:{color:'#8A8F9C'}}}}});
}

App.setReportTab=(t)=>{ UI.reportTab=t; render(); };
function reportRows(){
  switch(UI.reportTab){
    case 'visitors': return {head:['العميل','الجوال','وقت الدخول','وقت الخروج','المدة الفعلية'], rows:DB.checkins.map(c=>[c.customerName,c.customerPhone,fmtDT(c.entryAt),c.exitAt?fmtDT(c.exitAt):'—',c.actualHours?c.actualHours.toFixed(1):'—'])};
    case 'bookings': return {head:['العميل','الجوال','التاريخ','المدة','السعر','الحالة'], rows:DB.bookings.map(b=>[b.customerName,b.customerPhone,fmtDate(b.date),b.durationLabel,b.price,b.status])};
    case 'revenue': return {head:['المصدر','الوصف','المبلغ','التاريخ'], rows:[
        ...DB.checkins.filter(c=>c.status==='completed').map(c=>['حجز',c.customerName,c.finalPrice,fmtDT(c.exitAt)]),
        ...DB.orders.map(o=>['منتجات',o.items.map(i=>i.name).join('/'),o.total,fmtDT(o.createdAt)]) ]};
    case 'products': return {head:['المنتج','السعر','المخزون','عدد المباع','الإيراد'], rows:DB.products.map(p=>[p.name,p.price,p.stock,p.sold,p.sold*p.price])};
    case 'customers': return {head:['الاسم','الجوال','الزيارات','الساعات','الإنفاق'], rows:Object.values(DB.customers).map(c=>[c.name,c.phone,c.visits,Math.round(c.totalHours),c.totalSpent])};
    case 'usage': return {head:['العميل','التاريخ','المدة الفعلية (س)'], rows:DB.checkins.filter(c=>c.status==='completed').map(c=>[c.customerName,fmtDate(c.entryAt),c.actualHours.toFixed(1)])};
    case 'occupancy': return {head:['المقعد','الحالة الحالية'], rows:DB.seats.map(s=>[s.code,seatLabel(seatStatusNow(s.id))])};
  }
}
function reportTableHTML(){
  const {head,rows}=reportRows();
  return `<div class="scrollx"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
  ${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">لا توجد بيانات</td></tr>`}
  </tbody></table></div>`;
}
App.exportReport=()=>{
  const {head,rows}=reportRows();
  let csv='\uFEFF'+head.join(',')+'\n'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='تقرير-'+UI.reportTab+'-'+todayISO()+'.csv'; a.click();
  URL.revokeObjectURL(url);
};

  <div class="panel"><div class="panel-h"><h3>اشتراكات العملاء</h3></div>
  <div class="scrollx"><table><thead><tr><th>العميل</th><th>الجوال</th><th>الباقة</th><th>المتبقي</th><th>ينتهي</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${subs.length?subs.map(s=>`<tr><td>${esc(s.customerName)}</td><td class="num">${esc(s.customerPhone)}</td><td>${esc(s.packageName)}</td><td>${subRemaining(s)}</td><td>${fmtDate(s.expiresAt)}</td><td>${subBadge(s)}</td><td>${subIsActive(s)?`<button class="btn btn-danger btn-sm" onclick="App.cancelSub('${s.id}')">إلغاء الاشتراك</button>`:''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">لا توجد اشتراكات بعد</td></tr>'}
  </tbody></table></div></div>`;
};
packageFormModal=function(m){

  <div class="form-row"><label style="${LB}">مدة الصلاحية (أيام)</label><input class="input-dark" type="number" style="${ST}" id="pk_days" value="${p?p.days:30}"></div></div>

App.savePackage=(id)=>{
  const name=document.getElementById('pk_name').value.trim(), desc=document.getElementById('pk_desc').value.trim();
  const price=parseFloat(document.getElementById('pk_price').value||'0');
  const visits=parseInt(document.getElementById('pk_visits').value||'0',10)||0;
  const days=parseInt(document.getElementById('pk_days').value||'30',10)||30;
  if(!name||!price){ toast('يرجى تعبئة الحقول','err'); return; }
  if(id){ Object.assign(DB.settings.packages.find(x=>x.id===id),{name,desc,price,visits,days}); }

})();
    <script>
/* ===== تعديلات: بحث بالاسم عند الدخول + مبلغ مدفوع للاشتراك + خصم + استرجاع منتج ===== */
(function(){
const ST='width:100%;padding:10px;border-radius:8px;', LB='color:#B7BAC4;';
const cur=()=>DB.settings.currency;
const norm=s=>String(s||'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();

/* ---------- دوال مساعدة ---------- */
function subIsActive(s){
  if(s.status==='cancelled') return false;
  if(s.expiresAt&&s.expiresAt<todayISO()) return false;
  if(s.totalVisits>0&&s.usedVisits>=s.totalVisits) return false;
  return true;
}
function activeSubsFor(p){ return (DB.subscriptions||[]).filter(s=>s.customerPhone===p&&subIsActive(s)); }
function subRemaining(s){ return s.totalVisits>0?(s.totalVisits-s.usedVisits)+' من '+s.totalVisits+' زيارة متبقية':'زيارات غير محدودة ('+s.usedVisits+' مستخدمة)'; }
function subBadge(s){
  if(s.status==='cancelled') return '<span class="badge badge-red">ملغى</span>';
  if(s.totalVisits>0&&s.usedVisits>=s.totalVisits) return '<span class="badge badge-gray">مستنفد</span>';
  if(s.expiresAt&&s.expiresAt<todayISO()) return '<span class="badge badge-gray">منتهي</span>';
  return '<span class="badge badge-green">نشط</span>';
}
function paidOf(s){ return s.paid!==undefined ? Number(s.paid) : Number(s.price); }

/* ---------- العميل: إضافة حقل السكن ---------- */
upsertCustomer=function(phone,name,email,address){
  if(!DB.customers[phone]){
    DB.customers[phone]={phone,name,email:email||'',address:address||'',firstVisit:new Date().toISOString(),visits:0,totalHours:0,totalSpent:0,lastVisit:null};
  } else {
    const c=DB.customers[phone];
    if(name) c.name=name; if(email) c.email=email; if(address) c.address=address;
  }
  return DB.customers[phone];
};

/* ---------- الإيرادات تحسب المبلغ المدفوع فعلياً ---------- */
revenueInRange=function(range){
  const a=DB.checkins.filter(c=>c.status==='completed'&&inRange(c.exitAt,range)).reduce((s,c)=>s+(c.finalPrice||0),0);
  const b=DB.orders.filter(o=>inRange(o.createdAt,range)).reduce((s,o)=>s+o.total,0);
  const c=(DB.subscriptions||[]).filter(s=>s.status!=='cancelled'&&inRange(s.createdAt,range)).reduce((s,x)=>s+paidOf(x),0);
  return a+b+c;
};
const _rr=reportRows; reportRows=function(){
  const r=_rr();
  if(UI.reportTab==='revenue'&&r){
    r.rows=r.rows.filter(x=>x[0]!=='اشتراك');
    (DB.subscriptions||[]).filter(s=>s.status!=='cancelled').forEach(s=>r.rows.push(['اشتراك',s.customerName+' — '+s.packageName,paidOf(s),fmtDT(s.createdAt)]));
  }
  return r;
};

/* ============================================================
   1) الدخول الفوري: البحث بالاسم
   ============================================================ */
let WK={phone:null};
function wkInfo(phone){
  const c=DB.customers[phone]; if(!c) return '';
  const subs=activeSubsFor(phone);
  const box='background:#111;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;color:#C9CBD3;line-height:1.9;';
  const lab='display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;color:#EDEBE4;cursor:pointer;';
  const rd='width:auto;padding:0;margin:0;';
  return `<div style="${box}">
    <div style="color:#7fbf9c;font-weight:600;">عميل حالي: ${esc(c.name)} · <span class="num">${esc(c.phone)}</span></div>
    <div>السكن: ${esc(c.address||'—')}</div>
    <div>الزيارات: <b class="num">${c.visits}</b> · آخر زيارة: ${fmtDate(c.lastVisit)} · إجمالي المدفوع: ${fmtMoney(c.totalSpent)}</div>
  </div>
  <div class="stack" style="margin-bottom:12px;">
    <label style="${lab}"><input type="radio" name="wk_pay" value="" ${subs.length?'':'checked'} style="${rd}"><span>دفع عادي حسب المدة</span></label>
    ${subs.map((s,i)=>`<label style="${lab}"><input type="radio" name="wk_pay" value="${s.id}" ${i===0?'checked':''} style="${rd}"><span>اشتراك «${esc(s.packageName)}» — ${subRemaining(s)} · ينتهي ${fmtDate(s.expiresAt)}<br><small style="color:#7fbf9c;">سيتم خصم زيارة واحدة عند تسجيل الدخول</small></span></label>`).join('')}
  </div>
  <button class="btn btn-ghost-dark btn-sm" style="margin-bottom:12px;" onclick="App.sellSubFromWalkin()">+ بيع اشتراك لهذا العميل</button>`;
}
walkinModal=function(m){
  m=m||{};
  WK.phone=(m.phone&&DB.customers[m.phone])?m.phone:null;
  const sel=WK.phone?DB.customers[WK.phone]:null;
  const free=DB.seats.filter(s=>seatStatusNow(s.id)==='available');
  return `<div class="modal-bg"><div class="modal">
  <h3>حجز يدوي / زيارة فورية</h3>
  <div class="form-row"><label style="${LB}">اسم العميل (اكتب الاسم للبحث)</label>
    <input class="input-dark" style="${ST}" id="wk_name" autocomplete="off" value="${esc(sel?sel.name:(m.name||''))}" oninput="App.wkSearch(this.value)"></div>
  <div id="wk_results"></div>
  <div id="wk_new" style="display:${sel?'none':'block'};">
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">عميل جديد؟ اكتب رقم الهاتف والسكن وسيتم حفظه، وفي المرة القادمة ابحث باسمه فقط.</div>
    <div class="form-grid2">
      <div class="form-row"><label style="${LB}">رقم الهاتف</label><input class="input-dark" style="${ST}" id="wk_phone" value="${esc(m.phone||'')}"></div>
      <div class="form-row"><label style="${LB}">السكن</label><input class="input-dark" style="${ST}" id="wk_addr" value="${esc(m.addr||'')}"></div>
    </div>
  </div>
  <div id="wk_found">${sel?wkInfo(WK.phone):''}</div>
  <div class="form-row"><label style="${LB}">المدة</label><select class="input-dark" style="${ST}" id="wk_dur">${DB.settings.durations.map(d=>`<option value="${d.id}">${d.label} — ${d.price} ${cur()}</option>`).join('')}</select></div>
  <div class="form-row"><label style="${LB}">المقعد</label><select class="input-dark" style="${ST}" id="wk_seat"><option value="">بدون تحديد</option>${free.map(s=>`<option value="${s.id}">${s.code}</option>`).join('')}</select></div>
  <div style="display:flex;gap:10px;margin-top:8px;"><button class="btn btn-brass" style="flex:1;justify-content:center;" onclick="App.submitWalkin()">تسجيل الدخول الآن</button><button class="btn btn-ghost-dark" onclick="App.closeModal()">إلغاء</button></div>
  </div></div>`;
};
App.openWalkin=(phone,name)=>{ UI.modal={type:'walkin',phone:phone||'',name:name||''}; render(); };
App.wkSearch=(v)=>{
  WK.phone=null;
  const q=norm(v), res=document.getElementById('wk_results');
  document.getElementById('wk_found').innerHTML='';
  document.getElementById('wk_new').style.display='block';
  if(!q){ res.innerHTML=''; return; }
  const list=Object.values(DB.customers).filter(c=>norm(c.name).includes(q)).slice(0,6);
  const item='padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13px;background:#111;color:#EDEBE4;display:flex;justify-content:space-between;gap:8px;';
  res.innerHTML='<div style="margin-bottom:8px;">'
    +list.map(c=>`<div style="${item}" onclick="App.wkPick('${esc(c.phone)}')"><span>${esc(c.name)}</span><span style="color:var(--ink-soft);" class="num">${esc(c.phone)} · ${c.visits} زيارة</span></div>`).join('')
    +`<div style="${item}border-style:dashed;color:var(--brass-l);" onclick="App.wkNew()">+ عميل جديد باسم «${esc(v.trim())}»</div></div>`;
};
App.wkPick=(phone)=>{
  const c=DB.customers[phone]; if(!c) return;
  WK.phone=phone;
  document.getElementById('wk_name').value=c.name;
  document.getElementById('wk_results').innerHTML='';
  document.getElementById('wk_new').style.display='none';
  document.getElementById('wk_found').innerHTML=wkInfo(phone);
};
App.wkNew=()=>{
  WK.phone=null;
  document.getElementById('wk_results').innerHTML='';
  document.getElementById('wk_new').style.display='block';
  document.getElementById('wk_found').innerHTML='';
  const p=document.getElementById('wk_phone'); if(p) p.focus();
};
App.walkinPhoneCheck=()=>{};
App.sellSubFromWalkin=()=>{
  const name=document.getElementById('wk_name').value.trim();
  const phone=WK.phone||document.getElementById('wk_phone').value.trim();
  const addr=WK.phone?'':document.getElementById('wk_addr').value.trim();
  if(!name||phone.length<8){ toast('أدخل الاسم ورقم الهاتف أولاً','err'); return; }
  UI.modal={type:'sellSub',pkgId:'',phone,name,returnTo:'walkin',addr};
  render();
};
App.submitWalkin=()=>{
  const name=document.getElementById('wk_name').value.trim();
  const isNew=!WK.phone;
  const phone=isNew?document.getElementById('wk_phone').value.trim():WK.phone;
  const addr=isNew?document.getElementById('wk_addr').value.trim():'';
  const dur=durationById(document.getElementById('wk_dur').value), seatId=document.getElementById('wk_seat').value;
  const subId=(document.querySelector('input[name="wk_pay"]:checked')||{}).value||'';
  if(!name){ toast('اكتب اسم العميل','err'); return; }
  if(isNew){
    if(phone.length<8){ toast('عميل جديد: أدخل رقم هاتف صحيح','err'); return; }
    if(DB.customers[phone]){ toast('هذا الرقم مسجل باسم «'+DB.customers[phone].name+'» — ابحث عنه بالاسم','err'); return; }
  }
  let sub=null;
  if(subId){
    sub=DB.subscriptions.find(x=>x.id===subId);
    if(!sub||sub.customerPhone!==phone||!subIsActive(sub)){ toast('الاشتراك غير صالح','err'); return; }
    sub.usedVisits+=1;
  }
  const price=sub?0:dur.price;
  upsertCustomer(phone,name,'',addr);
  const bid=uid('bk'), now=new Date().toISOString();
  DB.bookings.push({id:bid,customerPhone:phone,customerName:name,date:todayISO(),time:nowTimeHM(),durationId:dur.id,durationLabel:dur.label,hours:dur.hours,price,people:1,seatId,status:'Checked-in',createdAt:now});
  DB.checkins.push({id:uid('ci'),bookingId:bid,customerPhone:phone,customerName:name,seatId,entryAt:now,exitAt:null,plannedHours:dur.hours,plannedPrice:price,actualHours:0,finalPrice:0,status:'active',subId:subId,walkin:true});
  addNotif('checkin','وصول عميل: '+name+(sub?' (اشتراك)':''));
  UI.modal=null; save();
};

/* السكن يظهر في تفاصيل العميل */
const _cd=customerDetailModal; customerDetailModal=function(m){
  const h=_cd(m), c=DB.customers[m.phone];
  if(!c||!c.address) return h;
  return h.replace('<div class="mini-stats"',()=>`<div style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 12px;">السكن: ${esc(c.address)}</div><div class="mini-stats"`);
};

/* ============================================================
   2) بيع الاشتراك: أسعار واضحة + المبلغ المدفوع يدوي
   ============================================================ */
function sellSubModal(m){
  const pk=DB.settings.packages, known=m.phone?DB.customers[m.phone]:null;
  if(!pk.length) return `<div class="modal-bg"><div class="modal"><h3>بيع اشتراك</h3><div class="empty">أضف باقة أولاً من صفحة الأسعار والباقات</div><button class="btn btn-ghost-dark" style="width:100%;justify-content:center;" onclick="App.closeModal()">إغلاق</button></div></div>`;
  const sel=pk.find(p=>p.id===m.pkgId)||pk[0];
  const card='display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:#EDEBE4;';
  return `<div class="modal-bg"><div class="modal" style="max-width:520px;"><h3>بيع اشتراك لعميل</h3>
  <div class="form-grid2">
    <div class="form-row"><label style="${LB}">رقم الجوال</label><input class="input-dark" style="${ST}" id="ss_phone" value="${esc(m.phone||'')}" oninput="App.sellSubPhoneCheck(this.value)"></div>
    <div class="form-row"><label style="${LB}">اسم العميل</label><input class="input-dark" style="${ST}" id="ss_name" value="${esc(m.name||(known?known.name:''))}"></div>
  </div>
  <div class="form-row"><label style="${LB}">اختر الباقة (السعر ظاهر بجانب كل باقة)</label>
    <div class="stack">
    ${pk.map(p=>`<label style="${card}"><span style="display:flex;align-items:center;gap:9px;"><input type="radio" name="ss_pkg" value="${p.id}" ${p.id===sel.id?'checked':''} onchange="App.ssPkg()" style="width:auto;padding:0;margin:0;">
      <span><b>${esc(p.name)}</b><br><small style="color:var(--ink-soft);">${p.visits>0?p.visits+' زيارة':'زيارات غير محدودة'} · صلاحية ${p.days} يوم</small></span></span>
      <span class="num" style="font-family:'Amiri',serif;font-size:20px;font-weight:700;color:var(--brass-l);white-space:nowrap;">${p.price} ${cur()}</span></label>`).join('')}
    </div></div>
  <div class="price-total"><span class="t">سعر الباقة</span><span class="v num" id="ss_price_txt">${sel.price} ${cur()}</span></div>
  <div class="form-grid2">
    <div class="form-row"><label style="${LB}">المبلغ المدفوع (اكتبه يدوياً)</label><input class="input-dark" type="number" min="0" style="${ST}" id="ss_paid" value="${sel.price}" oninput="App.ssCalc()"></div>
    <div class="form-row"><label style="${LB}">المتبقي على العميل</label><div id="ss_rest" class="input-dark num" style="${ST}">0 ${cur()}</div></div>
  </div>
  <div class="form-row"><label style="${LB}">تاريخ بداية الاشتراك</label><input class="input-dark" type="date" style="${ST}" id="ss_start" value="${todayISO()}"></div>
  <div style="display:flex;gap:10px;margin-top:8px;"><button class="btn btn-brass" style="flex:1;justify-content:center;" onclick="App.submitSellSub('${esc(m.returnTo||'')}')">تأكيد الاشتراك</button><button class="btn btn-ghost-dark" onclick="App.closeModal()">إلغاء</button></div></div></div>`;
}
function ssSelected(){ const v=(document.querySelector('input[name="ss_pkg"]:checked')||{}).value; return DB.settings.packages.find(p=>p.id===v); }
App.ssPkg=()=>{
  const p=ssSelected(); if(!p) return;
  document.getElementById('ss_price_txt').textContent=p.price+' '+cur();
  document.getElementById('ss_paid').value=p.price;
  App.ssCalc();
};
App.ssCalc=()=>{
  const p=ssSelected(); if(!p) return;
  const paid=parseFloat(document.getElementById('ss_paid').value||'0')||0;
  const rest=Math.max(0,p.price-paid);
  document.getElementById('ss_rest').textContent=rest+' '+cur()+(paid>p.price?' (المدفوع أكبر من السعر)':'');
};
App.sellSubPhoneCheck=(v)=>{ const c=DB.customers[v.trim()]; if(c) document.getElementById('ss_name').value=c.name; };
App.submitSellSub=(returnTo)=>{
  const phone=document.getElementById('ss_phone').value.trim(), name=document.getElementById('ss_name').value.trim();
  const pk=ssSelected();
  const start=document.getElementById('ss_start').value||todayISO();
  const paidRaw=parseFloat(document.getElementById('ss_paid').value);
  if(!phone||!name||!pk){ toast('يرجى إدخال الجوال والاسم واختيار الباقة','err'); return; }
  if(isNaN(paidRaw)||paidRaw<0){ toast('اكتب المبلغ المدفوع','err'); return; }
  const addr=(UI.modal&&UI.modal.addr)||'';
  const d=new Date(start+'T12:00:00'); d.setDate(d.getDate()+(pk.days||30));
  upsertCustomer(phone,name,'',addr).totalSpent+=paidRaw;
  DB.subscriptions.push({id:uid('sub'),customerPhone:phone,customerName:name,packageId:pk.id,packageName:pk.name,totalVisits:pk.visits||0,usedVisits:0,price:pk.price,paid:paidRaw,startDate:start,expiresAt:d.toISOString().slice(0,10),status:'active',createdAt:new Date().toISOString()});
  addNotif('booking','اشتراك جديد: '+name+' — '+pk.name+' (مدفوع '+paidRaw+')');
  UI.modal=returnTo==='walkin'?{type:'walkin',phone,name}:null;
  toast('تم تسجيل الاشتراك'); save();
};
App.doCancelSub=(id)=>{
  const s=DB.subscriptions.find(x=>x.id===id); if(!s) return; s.status='cancelled';
  const c=DB.customers[s.customerPhone]; if(c) c.totalSpent=Math.max(0,c.totalSpent-paidOf(s)); save();
};
App.paySub=(id)=>{
  const s=DB.subscriptions.find(x=>x.id===id); if(!s) return;
  const rest=Math.max(0,s.price-paidOf(s));
  const v=parseFloat(prompt('المتبقي '+rest+' '+cur()+' — اكتب المبلغ المسدد الآن:',rest));
  if(isNaN(v)||v<=0) return;
  s.paid=paidOf(s)+v;
  const c=DB.customers[s.customerPhone]; if(c) c.totalSpent+=v;
  toast('تم تسجيل الدفعة'); save();
};

/* صفحة الأسعار: سعر الباقة بارز + جدول الاشتراكات بالمدفوع والمتبقي */
const _pp=pgPricing; pgPricing=function(){
  let h=_pp();
  h=h.replace(/<td class="num">([^<]*)<\/td>(<td style="display:flex;gap:6px;"><button class="btn btn-brass btn-sm" onclick="App\.openSellSub)/g,
    '<td class="num" style="color:var(--brass-l);font-weight:700;font-size:15px;">$1</td>$2');
  const mark='<div class="panel"><div class="panel-h"><h3>اشتراكات العملاء</h3></div>';
  const i=h.indexOf(mark); if(i<0) return h;
  const subs=[...(DB.subscriptions||[])].reverse();
  return h.slice(0,i)+`<div class="panel"><div class="panel-h"><h3>اشتراكات العملاء</h3></div>
  <div class="scrollx"><table><thead><tr><th>العميل</th><th>الجوال</th><th>الباقة</th><th>السعر</th><th>المدفوع</th><th>المتبقي مالياً</th><th>الزيارات</th><th>ينتهي</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${subs.length?subs.map(s=>{
    const rest=Math.max(0,s.price-paidOf(s));
    return `<tr><td>${esc(s.customerName)}</td><td class="num">${esc(s.customerPhone)}</td><td>${esc(s.packageName)}</td>
    <td class="num">${fmtMoney(s.price)}</td><td class="num">${fmtMoney(paidOf(s))}</td>
    <td class="num" style="${rest>0?'color:#e08a7c;font-weight:700;':''}">${rest>0?fmtMoney(rest):'—'}</td>
    <td>${subRemaining(s)}</td><td>${fmtDate(s.expiresAt)}</td><td>${subBadge(s)}</td>
    <td style="display:flex;gap:6px;">${s.status!=='cancelled'&&rest>0?`<button class="btn btn-brass btn-sm" onclick="App.paySub('${s.id}')">تسديد</button>`:''}${subIsActive(s)?`<button class="btn btn-danger btn-sm" onclick="App.cancelSub('${s.id}')">إلغاء الاشتراك</button>`:''}</td></tr>`;
  }).join(''):'<tr><td colspan="10" class="empty">لا توجد اشتراكات بعد</td></tr>'}
  </tbody></table></div></div>`;
};

/* ============================================================
   3) خصم مبلغ عند تسجيل الخروج
   ============================================================ */
function coBase(c){
  const elapsedH=(Date.now()-new Date(c.entryAt).getTime())/3600000;
  const over=Math.max(0,elapsedH-c.plannedHours);
  return {elapsedH,over,base:c.plannedPrice+Math.ceil(over)*DB.settings.overtimeRate};
}
checkoutModal=function(m){
  const c=DB.checkins.find(x=>x.id===m.ciId); if(!c) return '';
  const k=coBase(c);
  return `<div class="modal-bg"><div class="modal">
  <h3>تسجيل خروج — ${esc(c.customerName)}</h3>
  <div class="stack" style="font-size:13.5px;color:#C9CBD3;">
    <div style="display:flex;justify-content:space-between;"><span>وقت الدخول</span><span>${fmtDT(c.entryAt)}</span></div>
    <div style="display:flex;justify-content:space-between;"><span>المدة الفعلية</span><span class="num">${k.elapsedH.toFixed(1)} ساعة</span></div>
    <div style="display:flex;justify-content:space-between;"><span>المدة المحجوزة</span><span class="num">${c.plannedHours} ساعة</span></div>
    ${k.over>0?`<div style="display:flex;justify-content:space-between;color:#e0b57c;"><span>ساعات إضافية</span><span class="num">${Math.ceil(k.over)} × ${DB.settings.overtimeRate} ${cur()}</span></div>`:''}
    <div style="display:flex;justify-content:space-between;"><span>المبلغ قبل الخصم</span><span class="num">${k.base} ${cur()}</span></div>
  </div>
  <div class="form-row" style="margin-top:12px;"><label style="${LB}">خصم مبلغ (اختياري)</label><input class="input-dark" type="number" min="0" value="0" style="${ST}" id="co_disc" oninput="App.coUpdate('${c.id}')"></div>
  <div class="price-total"><span class="t">السعر النهائي</span><span class="v num" id="co_final">${k.base} ${cur()}</span></div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-brass" style="flex:1;justify-content:center;" onclick="App.doCheckout('${c.id}')">تأكيد الخروج والدفع</button>
    <button class="btn btn-ghost-dark" onclick="App.closeModal()">إلغاء</button>
  </div></div></div>`;
};
App.coUpdate=(id)=>{
  const c=DB.checkins.find(x=>x.id===id); if(!c) return;
  const base=coBase(c).base;
  const d=Math.min(Math.max(0,parseFloat(document.getElementById('co_disc').value||'0')||0),base);
  document.getElementById('co_final').textContent=(base-d)+' '+cur();
};
App.doCheckout=(ciId)=>{
  const c=DB.checkins.find(x=>x.id===ciId); if(!c) return;
  const k=coBase(c);
  const el=document.getElementById('co_disc');
  const disc=Math.min(Math.max(0,parseFloat(el?el.value:'0')||0),k.base);
  const finalPrice=k.base-disc;
  c.exitAt=new Date().toISOString(); c.actualHours=k.elapsedH; c.finalPrice=finalPrice; c.discount=disc; c.status='completed';
  if(c.bookingId){ const b=DB.bookings.find(x=>x.id===c.bookingId); if(b) b.status='Completed'; }
  const cust=upsertCustomer(c.customerPhone,c.customerName);
  cust.visits+=1; cust.totalHours+=k.elapsedH; cust.totalSpent+=finalPrice; cust.lastVisit=c.exitAt;
  addNotif('checkout','تسجيل خروج: '+c.customerName+' — '+fmtMoney(finalPrice)+(disc?' (خصم '+disc+')':''));
  UI.modal=null; save();
};

/* ============================================================
   4) نقطة البيع: خصم مبلغ
   ============================================================ */
let posDisc=0, posPhone='';
function posSub(){ return posCart.reduce((s,i)=>s+i.price*i.qty,0); }
posModal=function(){
  const sub=posSub(), disc=Math.min(Math.max(0,posDisc),sub), total=sub-disc;
  return `<div class="modal-bg"><div class="modal" style="max-width:520px;">
  <h3>نقطة بيع سريعة</h3>
  <div class="prod-grid" style="margin-bottom:16px;">
    ${DB.products.map(p=>`<div class="prod-card" style="cursor:pointer;background:var(--ink3);border-color:var(--line);" onclick="App.addToCart('${p.id}')"><div class="prod-emoji">${p.emoji}</div><div class="prod-name">${esc(p.name)}</div><div class="prod-price">${fmtMoney(p.price)}</div></div>`).join('')}
  </div>
  ${posCart.length?`<div class="stack" style="margin-bottom:10px;">${posCart.map((i,idx)=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;"><span>${i.emoji} ${esc(i.name)} ×${i.qty}</span><span class="num">${fmtMoney(i.price*i.qty)} <button class="btn btn-danger btn-sm" style="padding:2px 8px;margin-right:6px;" onclick="App.removeFromCart(${idx})">×</button></span></div>`).join('')}</div>`:'<div class="empty">السلة فارغة — اضغط على منتج لإضافته</div>'}
  <div class="form-grid2">
    <div class="form-row"><label style="${LB}">جوال العميل (اختياري)</label><input class="input-dark" style="${ST}" id="pos_phone" value="${esc(posPhone)}" oninput="posPhoneSet(this.value)"></div>
    <div class="form-row"><label style="${LB}">خصم مبلغ (اختياري)</label><input class="input-dark" type="number" min="0" style="${ST}" id="pos_disc" value="${posDisc||''}" oninput="App.posDiscChange(this.value)"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:13px;color:#C9CBD3;margin-bottom:6px;"><span>المجموع قبل الخصم</span><span class="num" id="pos_sub">${sub} ${cur()}</span></div>
  <div class="price-total"><span class="t">الإجمالي بعد الخصم</span><span class="v num" id="pos_total">${total} ${cur()}</span></div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-brass" style="flex:1;justify-content:center;" onclick="App.completeSale()" ${posCart.length?'':'disabled'}>إتمام البيع</button>
    <button class="btn btn-ghost-dark" onclick="App.closeModal()">إلغاء</button>
  </div></div></div>`;
};
window.posPhoneSet=(v)=>{ posPhone=v; };
App.posDiscChange=(v)=>{
  posDisc=Math.max(0,parseFloat(v||'0')||0);
  const sub=posSub(), disc=Math.min(posDisc,sub);
  document.getElementById('pos_total').textContent=(sub-disc)+' '+cur();
};
App.openPOS=()=>{ posCart=[]; posDisc=0; posPhone=''; UI.modal={type:'pos'}; render(); };
App.completeSale=()=>{
  if(!posCart.length) return;
  const phone=(posPhone||'').trim();
  const sub=posSub(), disc=Math.min(Math.max(0,posDisc),sub), total=sub-disc;
  DB.orders.push({id:uid('or'),items:posCart.map(i=>({productId:i.productId,name:i.name,qty:i.qty,price:i.price})),subtotal:sub,discount:disc,total,customerPhone:phone||'',staff:currentStaff()?.name||'',createdAt:new Date().toISOString()});
  posCart.forEach(i=>{ const p=DB.products.find(x=>x.id===i.productId); if(p){ p.stock-=i.qty; p.sold+=i.qty; if(p.stock<5) addNotif('stock','مخزون منخفض: '+p.name+' ('+p.stock+' متبقي)'); } });
  if(phone&&DB.customers[phone]) DB.customers[phone].totalSpent+=total;
  posCart=[]; posDisc=0; posPhone=''; UI.modal=null; toast('تم تسجيل عملية البيع'); save();
};

/* ============================================================
   5) استرجاع منتج + خصم المبلغ المسترجع
   ============================================================ */
const _pg=pgProducts; pgProducts=function(){
  let h=_pg();
  const mark='<div class="panel"><div class="panel-h"><h3>آخر المبيعات</h3></div>';
  const i=h.indexOf(mark); if(i<0) return h;
  const rows=[...DB.orders].reverse().slice(0,30);
  return h.slice(0,i)+`<div class="panel"><div class="panel-h"><h3>آخر المبيعات</h3><span class="sub">اضغط «استرجاع» بجانب الفاتورة لإرجاع منتج وخصم المبلغ</span></div>
  ${rows.length?`<div class="scrollx"><table><thead><tr><th>الوقت</th><th>العميل</th><th>المنتجات</th><th>الخصم</th><th>الإجمالي</th><th>المرتجع</th><th></th></tr></thead><tbody>
  ${rows.map(o=>{
    const ret=(o.returns||[]);
    const retAmt=ret.reduce((s,r)=>s+r.amount,0);
    return `<tr><td>${fmtDT(o.createdAt)}</td><td>${o.customerPhone?esc(DB.customers[o.customerPhone]?.name||o.customerPhone):'زبون عابر'}</td>
    <td>${o.items.length?o.items.map(x=>esc(x.name)+' ×'+x.qty).join('، '):'—'}</td>
    <td class="num">${o.discount?fmtMoney(o.discount):'—'}</td><td class="num">${fmtMoney(o.total)}</td>
    <td>${ret.length?`<span class="badge badge-red">${ret.map(r=>r.items.map(x=>esc(x.name)+'×'+x.qty).join('، ')).join(' | ')} (−${fmtMoney(retAmt)})</span>`:'—'}</td>
    <td>${o.items.length?`<button class="btn btn-ghost-dark btn-sm" onclick="App.openReturn('${o.id}')">↩ استرجاع</button>`:''}</td></tr>`;
  }).join('')}
  </tbody></table></div>`:'<div class="empty">لا توجد مبيعات بعد</div>'}</div>`;
};
App.openReturn=(id)=>{ UI.modal={type:'returnProduct',orderId:id}; render(); };
function rtRatio(o){ const s=o.items.reduce((a,i)=>a+i.price*i.qty,0); return s>0?o.total/s:1; }
function returnModal(m){
  const o=DB.orders.find(x=>x.id===m.orderId); if(!o) return '';
  return `<div class="modal-bg"><div class="modal">
  <h3>استرجاع منتج</h3>
  <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">فاتورة ${fmtDT(o.createdAt)} — اكتب الكمية المراد إرجاعها من كل منتج. ${o.discount?'سيُحتسب المبلغ بنسبة الخصم الذي أُعطي في الفاتورة، ويمكنك تعديله.':''}</div>
  <div class="stack" style="margin-bottom:12px;">
  ${o.items.map((i,idx)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;"><span>${esc(i.name)} — ${i.qty} × ${i.price}</span><input class="input-dark" type="number" min="0" max="${i.qty}" value="0" id="rt_q_${idx}" style="width:80px;padding:6px 8px;" oninput="App.rtCalc('${o.id}')"></div>`).join('')}
  </div>
  <div class="form-row"><label style="${LB}">المبلغ المسترجع للعميل (${cur()}) — يمكن تعديله</label><input class="input-dark" type="number" min="0" style="${ST}" id="rt_amt" value="0"></div>
  <div style="display:flex;gap:10px;"><button class="btn btn-brass" style="flex:1;justify-content:center;" onclick="App.doReturn('${o.id}')">تأكيد الاسترجاع</button><button class="btn btn-ghost-dark" onclick="App.closeModal()">إلغاء</button></div>
  </div></div>`;
}
App.rtCalc=(id)=>{
  const o=DB.orders.find(x=>x.id===id); if(!o) return;
  const ratio=rtRatio(o); let sum=0;
  o.items.forEach((i,idx)=>{
    const el=document.getElementById('rt_q_'+idx);
    let q=Math.max(0,Math.min(i.qty,parseInt(el.value||'0',10)||0));
    sum+=i.price*q*ratio;
  });
  document.getElementById('rt_amt').value=Math.round(sum*100)/100;
};
App.doReturn=(id)=>{
  const o=DB.orders.find(x=>x.id===id); if(!o) return;
  const picked=[];
  o.items.forEach((i,idx)=>{
    const q=Math.max(0,Math.min(i.qty,parseInt(document.getElementById('rt_q_'+idx).value||'0',10)||0));
    if(q>0) picked.push({idx,q});
  });
  if(!picked.length){ toast('اختر كمية للاسترجاع','err'); return; }
  const refund=Math.min(Math.max(0,parseFloat(document.getElementById('rt_amt').value||'0')||0),o.total);
  const logItems=[];
  picked.forEach(({idx,q})=>{
    const it=o.items[idx];
    const p=DB.products.find(x=>x.id===it.productId);
    if(p){ p.stock+=q; p.sold=Math.max(0,p.sold-q); }
    it.qty-=q; logItems.push({name:it.name,qty:q});
  });
  o.items=o.items.filter(i=>i.qty>0);
  o.total=Math.max(0,o.total-refund);
  o.returns=(o.returns||[]); o.returns.push({at:new Date().toISOString(),items:logItems,amount:refund,staff:currentStaff()?.name||''});
  if(o.customerPhone&&DB.customers[o.customerPhone]) DB.customers[o.customerPhone].totalSpent=Math.max(0,DB.customers[o.customerPhone].totalSpent-refund);
  addNotif('checkout','استرجاع منتج: '+logItems.map(x=>x.name+'×'+x.qty).join('، ')+' — خصم '+fmtMoney(refund));
  UI.modal=null; toast('تم الاسترجاع وخصم المبلغ'); save();
};

/* ---------- ربط النوافذ ---------- */
const _rm=renderModal; renderModal=function(){
  const m=UI.modal, t=m&&m.type;
  if(t==='sellSub'||t==='returnProduct'){
    const h=document.createElement('div'); document.body.appendChild(h);
    h.outerHTML=t==='sellSub'?sellSubModal(m):returnModal(m); return;
  }
  _rm();
};
})();
</script>
</script>
</body>
