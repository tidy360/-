function vDash(){
  const c=C(), t=today();
  const act=c.courses.filter(x=>x.status==='active'&&!x.archived);
  const studs=new Set(c.enrolls.filter(e=>e.status==='active').map(e=>e.studentId)).size;
  const sched=c.sessions.filter(s=>s.status==='scheduled');
  const todayS=c.sessions.filter(s=>s.date===t&&(s.status==='scheduled'||s.status==='completed')).sort((a,b)=>a.start.localeCompare(b.start));
  const rev=r2(c.sPays.reduce((a,p)=>a+p.amount,0)), tp=r2(c.tPays.reduce((a,p)=>a+p.amount,0));
  const outT=r2(c.teachers.reduce((a,x)=>a+Math.max(0,tStats(x.id).bal),0));
  const upcoming=sched.filter(s=>s.date>=t).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,8);
  const recent=c.sessions.filter(s=>s.status==='completed').sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).slice(0,8);
  const row=s=>{const cc=course(s.courseId)||{},tt=teacher(cc.teacherId)||{};return [fD(s.date),esc(cc.name||'—'),esc(tt.name||'—'),'<span class="num">'+s.start+' – '+s.end+'</span>',esc(s.room||'—'),'<a class="btn btn-ghost-dark btn-sm" onclick="CM.openSess(\''+s.id+'\')">فتح</a>'];};
  const H=['التاريخ','الكورس','المعلم','الوقت','القاعة',''];
  const al=[];
  if(todayS.length) al.push(['📅','لديك '+todayS.length+' حصة اليوم']);
  const pend=c.sessions.filter(s=>s.status==='postponed'&&(byId(c.sessions,s.movedTo)||{}).status==='scheduled');
  if(pend.length) al.push(['↻',pend.length+' حصة مؤجلة بانتظار موعدها الجديد']);
  const soon=upcoming.filter(s=>s.date<=addDays(t,2)&&s.date>t);
  if(soon.length) al.push(['⏰',soon.length+' حصة خلال اليومين القادمين']);
  const unp=c.enrolls.filter(e=>e.status==='active'&&e.fee-paidOfEn(e.id)>0);
  if(unp.length) al.push(['💳',unp.length+' طالب عليهم رسوم غير مسددة بإجمالي '+money(unp.reduce((a,e)=>a+e.fee-paidOfEn(e.id),0))]);
  const tw=c.teachers.filter(x=>tStats(x.id).bal>0);
  if(tw.length) al.push(['👨‍🏫',tw.length+' معلم لديهم مستحقات غير مدفوعة بإجمالي '+money(outT)]);
  const ending=c.courses.filter(x=>x.status==='active'&&!x.archived&&x.endDate&&x.endDate<=addDays(t,14));
  ending.forEach(x=>al.push(['🏁','الكورس «'+esc(x.name)+'» '+(x.endDate<t?'تجاوز تاريخ نهايته ('+fD(x.endDate)+')':'ينتهي في '+fD(x.endDate))]));
  return '<div class="kpi-grid">'+kpi('الكورسات النشطة',act.length)+kpi('الطلاب المسجلون',studs)+kpi('المعلمون',c.teachers.length)+kpi('الحصص المجدولة',sched.length)+kpi('حصص اليوم',todayS.length)+kpi('إيرادات الكورسات',money(rev))+kpi('مدفوعات المعلمين',money(tp))+kpi('مستحقات معلمين غير مدفوعة',money(outT))+'</div>'
  +'<div class="panel"><div class="panel-h"><h3>تنبيهات</h3></div>'+(al.length?al.map(a=>'<div class="notif-item"><div class="ic">'+a[0]+'</div><div><div class="t">'+a[1]+'</div></div></div>').join(''):empty('لا توجد تنبيهات'))+'</div>'
  +'<div class="panel"><div class="panel-h"><h3>حصص اليوم</h3></div>'+tbl(H,todayS.map(row))+'</div>'
  +'<div class="panel"><div class="panel-h"><h3>الحصص القادمة</h3></div>'+tbl(H,upcoming.map(row))+'</div>'
  +'<div class="panel"><div class="panel-h"><h3>حصص اكتملت مؤخراً</h3></div>'+tbl(H.slice(0,5).concat(['الساعات','']),recent.map(s=>{const r=row(s);r.splice(5,0,'<span class="num">'+s.hours+'</span>');return r;}))+'</div>';
}

function parseStudents(txt){
  const ok=[], bad=[];
  txt.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const p=l.split(/[,،\t]/).map(x=>x.trim()).filter(Boolean);
    const phone=(p.length>1?p[p.length-1]:'').replace(/\s+/g,''), name=p[0]||'';
    if(!name||phone.replace(/\D/g,'').length<7) bad.push(l); else ok.push({name,phone});
  });
  return {ok,bad};
}
function enrollStudent(cid,name,phone,fee,regDate){
  const c=C(); let st=c.students.find(x=>x.phone===phone);
  if(!st){ st={id:uid('stu'),name,phone,createdAt:nowISO()}; c.students.push(st); }
  if(c.enrolls.some(e=>e.courseId===cid&&e.studentId===st.id&&e.status==='active')) return false;
  c.enrolls.push({id:uid('en'),courseId:cid,studentId:st.id,fee,regDate:regDate||today(),status:'active',createdAt:nowISO(),by:who()});
  return true;
}
CM.saveCourse=id=>{
  const name=val('cf_name'), subject=val('cf_subject'), price=num(val('cf_price')), rate=num(val('cf_rate'));
  const sd=val('cf_start'), ed=val('cf_end'), pw=parseInt(val('cf_pw'),10)||0, hrs=num(val('cf_hrs')), st=val('cf_status'), desc=val('cf_desc');
  let tid=val('cf_teacher');
  if(!name) return toast('اكتب اسم الكورس','err');
  if(!sd||!ed||ed<sd) return toast('تحقق من تاريخي البداية والنهاية','err');
  if(hrs<=0||pw<=0) return toast('أدخل عدد الحصص ومدتها','err');
  if(price<0||rate<0) return toast('القيم المالية غير صحيحة','err');
  let tn='',tp='';
  if(tid==='__new'||!tid){ tn=val('cf_tname'); tp=val('cf_tphone'); if(!tn||tp.length<7) return toast('أدخل اسم وجوال المعلم','err'); tid='__new'; }
  let sp={ok:[],bad:[]}; if(!id&&$('cf_students')) sp=parseStudents($('cf_students').value);
  if(sp.bad.length) return toast('سطر غير صحيح في الطلاب: '+sp.bad[0],'err');
  let n=0;
  const ok=tx(()=>{
    const c=C();
    if(tid==='__new'){ let t=c.teachers.find(x=>x.phone===tp); if(!t){ t={id:uid('tc'),name:tn,phone:tp,subject,rate,createdAt:nowISO()}; c.teachers.push(t); } tid=t.id; }
    if(id){ Object.assign(course(id),{name,subject,teacherId:tid,price,rate,startDate:sd,endDate:ed,perWeek:pw,classHours:hrs,status:st,desc,updatedAt:nowISO()}); }
    else{ const cid=uid('cr'); c.courses.push({id:cid,name,subject,teacherId:tid,price,rate,startDate:sd,endDate:ed,perWeek:pw,classHours:hrs,status:st,desc,archived:false,createdAt:nowISO(),by:who()});
      sp.ok.forEach(s=>{ if(enrollStudent(cid,s.name,s.phone,price,today())) n++; }); }
  });
  if(ok){ if(!id) addNotif('booking','كورس جديد: '+name+(n?' ('+n+' طالب)':'')); done(id?'تم تحديث الكورس':'تم إنشاء الكورس'); }
};

function fSess(){ const s=S(); return C().sessions.filter(x=>(!s.fCourse||x.courseId===s.fCourse)&&(!s.fTeacher||(course(x.courseId)||{}).teacherId===s.fTeacher)); }
const COL={scheduled:['#3c5aa0','rgba(60,90,160,.16)'],completed:['#3E7A5B','rgba(62,122,91,.18)'],postponed:['#C9A15A','rgba(201,161,90,.12)'],cancelled:['#B4483A','rgba(180,72,58,.14)']};
function chip(s){
  const c=course(s.courseId)||{name:'—'}, t=teacher(c.teacherId)||{name:'—'}, col=COL[s.status], dim=(s.status==='postponed'||s.status==='cancelled')?'text-decoration:line-through;opacity:.7;':'';
  return '<div onclick="CM.openSess(\''+s.id+'\')" style="cursor:pointer;border:1px solid '+col[0]+';background:'+col[1]+';border-radius:9px;padding:7px 9px;margin-bottom:6px;font-size:12px;"><div style="'+dim+'"><b>'+esc(c.name)+'</b><div class="num">'+s.start+'–'+s.end+' · '+s.hours+'س</div><div>'+esc(t.name)+(s.room?' · '+esc(s.room):'')+'</div></div><div style="margin-top:3px;">'+bdg(SS,s.status)+(s.rescheduledFrom?' <span style="color:#E2C892;">↻ معاد جدولتها</span>':'')+'</div></div>';
}
function vSchedule(){
  const s=S(), all=fSess(), views=[['week','أسبوعي'],['day','يومي'],['month','شهري']];
  let title='', body='';
  if(s.view==='week'){
    const d=pd(s.date), st=addDays(s.date,-((d.getDay()+1)%7)); title='أسبوع '+fD(st)+' – '+fD(addDays(st,6));
    body='<div class="scrollx"><div style="display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;">'+WEEK.map((_,i)=>{ const iso=addDays(st,i), list=all.filter(x=>x.date===iso).sort((a,b)=>a.start.localeCompare(b.start));
      return '<div style="background:var(--ink3);border:1px solid '+(iso===today()?'var(--brass)':'var(--line)')+';border-radius:10px;padding:8px;min-height:120px;"><div style="font-weight:700;font-size:13px;margin-bottom:6px;cursor:pointer;" onclick="CM.day(\''+iso+'\')">'+DAYS[pd(iso).getDay()]+' <span class="num" style="color:var(--ink-soft);font-weight:400;">'+fD(iso).slice(1,6)+'</span></div>'+list.map(chip).join('')+'</div>'; }).join('')+'</div></div>';
  } else if(s.view==='day'){
    title=DAYS[pd(s.date).getDay()]+' '+fD(s.date);
    const list=all.filter(x=>x.date===s.date).sort((a,b)=>a.start.localeCompare(b.start));
    body=list.length?list.map(chip).join(''):empty('لا توجد حصص في هذا اليوم');
  } else {
    const d0=pd(s.date), y=d0.getFullYear(), m=d0.getMonth(), off=(new Date(y,m,1).getDay()+1)%7, dim=new Date(y,m+1,0).getDate();
    title=MONTHS[m]+' '+y; let cells='';
    for(let i=0;i<off;i++) cells+='<div></div>';
    for(let d=1;d<=dim;d++){ const iso=ymd(new Date(y,m,d)), list=all.filter(x=>x.date===iso).sort((a,b)=>a.start.localeCompare(b.start));
      cells+='<div onclick="CM.day(\''+iso+'\')" style="cursor:pointer;background:var(--ink3);border:1px solid '+(iso===today()?'var(--brass)':'var(--line)')+';border-radius:9px;padding:6px;min-height:84px;font-size:11px;"><div class="num" style="font-weight:700;margin-bottom:3px;">'+d+'</div>'
        +list.slice(0,3).map(x=>'<div style="border-right:3px solid '+COL[x.status][0]+';padding-right:4px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;'+((x.status==='postponed'||x.status==='cancelled')?'text-decoration:line-through;opacity:.6;':'')+'">'+x.start+' '+esc((course(x.courseId)||{}).name||'')+'</div>').join('')+(list.length>3?'<div style="color:var(--ink-soft);">+'+(list.length-3)+' أخرى</div>':'')+'</div>'; }
    body='<div class="scrollx"><div style="min-width:640px;"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:12px;color:var(--ink-soft);text-align:center;">'+WEEK.map(i=>'<div>'+DAYS[i]+'</div>').join('')+'</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">'+cells+'</div></div></div>';
  }
  const leg=Object.keys(SS).map(k=>'<span style="display:flex;align-items:center;gap:5px;font-size:12px;"><i class="dot" style="background:'+COL[k][0]+';"></i>'+SS[k][0]+'</span>').join('');
  return '<div class="panel"><div class="toolbar"><div class="chip-filter">'+views.map(v=>'<span class="chip '+(s.view===v[0]?'on':'')+'" onclick="CM.view(\''+v[0]+'\')">'+v[1]+'</span>').join('')+'</div>'
  +'<button class="btn btn-ghost-dark btn-sm" onclick="CM.shift(-1)">→ السابق</button><button class="btn btn-ghost-dark btn-sm" onclick="CM.today()">اليوم</button><button class="btn btn-ghost-dark btn-sm" onclick="CM.shift(1)">التالي ←</button><b>'+title+'</b></div>'
  +'<div class="toolbar">'+sel('sch_fc',cOpts('كل الكورسات'),s.fCourse,'class="input-dark" onchange="CM.filt()" style="width:auto;min-width:160px;padding:8px;"').replace('style="'+ST+'"','')+sel('sch_ft',tOpts('كل المعلمين'),s.fTeacher,'onchange="CM.filt()" style="width:auto;min-width:160px;padding:8px;"').replace('style="'+ST+'"','')
  +'<div style="display:flex;gap:12px;flex-wrap:wrap;">'+leg+'</div><div style="display:flex;gap:6px;margin-right:auto;"><button class="btn btn-brass btn-sm" onclick="CM.openSched(\'\',\'rec\')">+ جدولة متكررة</button><button class="btn btn-ghost-dark btn-sm" onclick="CM.openSched(\'\',\'one\')">+ حصة منفردة</button></div></div>'+body+'</div>';
}
CM.view=v=>{ S().view=v; render(); };
CM.day=iso=>{ const s=S(); s.date=iso; s.view='day'; render(); };
CM.today=()=>{ S().date=today(); render(); };
CM.filt=()=>{ const s=S(); s.fCourse=val('sch_fc'); s.fTeacher=val('sch_ft'); render(); };
CM.shift=n=>{ const s=S(); if(s.view==='week') s.date=addDays(s.date,7*n); else if(s.view==='day') s.date=addDays(s.date,n); else { const d=pd(s.date); d.setDate(1); d.setMonth(d.getMonth()+n); s.date=ymd(d); } render(); };

/* ---------------- جدولة الحصص ---------------- */
function roomPick(cur){ return fld('القاعة',sel('sc_room',[['','بدون قاعة']].concat(C().rooms.map(r=>[r,r])),cur||'')+'<input class="input-dark" style="'+ST+'margin-top:6px;" id="sc_room2" placeholder="أو اكتب اسم قاعة جديدة">'); }
MODALS.cm_sched=function(m){
  const rec=m.mode==='rec', c=m.cid?course(m.cid):null, cs=C().courses.filter(x=>!x.archived&&x.status!=='cancelled');
  if(!cs.length) return mdl('جدولة حصص',empty('أنشئ كورساً أولاً')+closeB);
  const cur=c||cs[0];
  return mdl(rec?'جدولة حصص متكررة':'حصة منفردة',
   fld('الكورس',sel('sc_course',cs.map(x=>[x.id,x.name]),cur.id))
  +(rec?fld('أيام الأسبوع','<div style="display:flex;gap:8px;flex-wrap:wrap;">'+WEEK.map(d=>'<label style="display:flex;gap:5px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;"><input type="checkbox" class="sc_day" value="'+d+'" style="width:auto;">'+DAYS[d]+'</label>').join('')+'</div>'):fld('التاريخ',inp('sc_date',today(),'type="date"')))
  +g2(fld('وقت البداية',inp('sc_start','16:00','type="time"')),fld('وقت النهاية',inp('sc_end',toHM(960+Math.round(cur.classHours*60)),'type="time"')))
  +(rec?g2(fld('من تاريخ',inp('sc_from',cur.startDate>today()?cur.startDate:today(),'type="date"')),fld('إلى تاريخ',inp('sc_to',cur.endDate,'type="date"'))):'')
  +roomPick('')+okc(rec?'إنشاء الحصص':'إضافة الحصة',"CM.saveSched('"+m.mode+"')"));
};
CM.openSched=(cid,mode)=>openM({type:'cm_sched',cid,mode});
function pickRoom(){ const r2_=val('sc_room2'); if(r2_){ if(C().rooms.indexOf(r2_)<0) C().rooms.push(r2_); return r2_; } return val('sc_room'); }
CM.saveSched=mode=>{
  const cid=val('sc_course'), c=course(cid), st=val('sc_start'), en=val('sc_end');
  if(!c) return toast('اختر الكورس','err');
  if(!st||!en||tm(en)<=tm(st)) return toast('وقت النهاية يجب أن يكون بعد البداية','err');
  const room=val('sc_room2')||val('sc_room'), hours=sHours(st,en);
  let dates=[];
  if(mode==='rec'){
    const days=[...document.querySelectorAll('.sc_day:checked')].map(x=>+x.value), f=val('sc_from'), t=val('sc_to');
    if(!days.length) return toast('اختر يوماً واحداً على الأقل','err');
    if(!f||!t||t<f) return toast('تحقق من الفترة','err');
    for(let d=f,i=0;d<=t&&i<800;d=addDays(d,1),i++) if(days.indexOf(pd(d).getDay())>=0) dates.push(d);
    if(!dates.length) return toast('لا توجد أيام مطابقة في هذه الفترة','err');
  } else { const d=val('sc_date'); if(!d) return toast('اختر التاريخ','err'); dates=[d]; }
  let made=0; const skipped=[];
  if(tx(()=>{ pickRoom(); const seriesId=uid('ser');
    dates.forEach(d=>{
      if(C().sessions.some(s=>s.courseId===cid&&s.date===d&&s.start===st&&s.status!=='cancelled'&&s.status!=='postponed')){ skipped.push(fD(d)+' — حصة مكررة'); return; }
      const cf=conflicts(c,d,st,en,null,room); if(cf.length){ skipped.push(fD(d)+' — '+cf[0]); return; }
      C().sessions.push({id:uid('ss'),courseId:cid,date:d,start:st,end:en,hours,room,status:'scheduled',seriesId,createdAt:nowISO(),by:who()}); made++; }); })){
    if(mode==='one'&&!made){ toast(skipped[0]||'تعذر الإضافة','err'); return; }
    addNotif('booking','تمت جدولة '+made+' حصة لكورس «'+c.name+'»');
    if(skipped.length) openM({type:'cm_info',title:'تمت جدولة '+made+' حصة',html:'<div style="font-size:13px;margin-bottom:8px;">تم تخطي '+skipped.length+' موعد:</div><div class="stack" style="font-size:12.5px;color:#e0b57c;">'+skipped.slice(0,20).map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>'});
    else done('تمت جدولة '+made+' حصة');
    if(skipped.length) save();
  }
};
MODALS.cm_info=function(m){ return mdl(m.title,m.html+closeB); };

MODALS.cm_sess=function(m){
  const s=byId(C().sessions,m.sid); if(!s) return mdl('الحصة',empty('غير موجودة')+closeB);
  const c=course(s.courseId)||{}, t=teacher(c.teacherId)||{};
  const row=(l,v)=>'<div style="display:flex;justify-content:space-between;gap:10px;"><span style="color:var(--ink-soft);">'+l+'</span><span>'+v+'</span></div>';
  let h='<div class="stack" style="font-size:13.5px;margin-bottom:12px;">'+row('الكورس',esc(c.name||'—'))+row('المعلم',esc(t.name||'—'))+row('التاريخ',fD(s.date)+' ('+DAYS[pd(s.date).getDay()]+')')+row('الوقت','<span class="num">'+s.start+' – '+s.end+'</span> ('+s.hours+' ساعة)')+row('القاعة',esc(s.room||'—'))+row('الحالة',bdg(SS,s.status))
   +(s.status==='completed'?row('مستحق المعلم',money(sessEarn(s))):'')+(s.reason?row('السبب',esc(s.reason)):'')+(s.rescheduledFrom?row('معاد جدولتها من',fD(s.origDate)+' '+(s.origStart||'')):'')+'</div>';
  const logs=C().logs.filter(l=>l.sessionId===s.id||l.newSessionId===s.id);
  if(logs.length) h+='<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.8;"><b>سجل التغييرات:</b>'+logs.map(l=>'<div>• '+(l.action==='postpone'?'تأجيل من '+fD(l.fromDate)+' '+l.fromStart+' إلى '+fD(l.toDate)+' '+l.toStart:l.action==='cancel'?'إلغاء':'تعديل')+' — '+esc(l.reason||'')+' ('+esc(l.by||'')+' · '+fD(l.at.slice(0,10))+')</div>').join('')+'</div>';
  if(s.status==='scheduled'||s.status==='completed'){
    const ens=enrollsOf(s.courseId,false).concat(enrollsOf(s.courseId,true).filter(e=>e.status!=='active'&&C().att.some(a=>a.sessionId===s.id&&a.enrollId===e.id)));

  }

  return mdl('تفاصيل الحصة',h+'<div style="display:flex;gap:8px;flex-wrap:wrap;">'+b+'<button class="btn btn-ghost-dark" onclick="App.closeModal()">إغلاق</button></div>',560);

CM.openSess=sid=>openM({type:'cm_sess',sid});
CM.allPresent=()=>document.querySelectorAll('input[type=radio][value=present]').forEach(r=>{ r.checked=true; });
function readAtt(sid){
  const s=byId(C().sessions,sid), c=C();
  c.enrolls.filter(e=>e.courseId===s.courseId).forEach(e=>{
    const r=document.querySelector('input[name="at_'+e.id+'"]:checked'); if(!r) return;
    const ex=c.att.find(a=>a.sessionId===sid&&a.enrollId===e.id);
    if(ex){ ex.status=r.value; ex.at=nowISO(); ex.by=who(); } else c.att.push({id:uid('at'),sessionId:sid,enrollId:e.id,status:r.value,at:nowISO(),by:who()});
  });
}
CM.saveAtt=sid=>{ if(tx(()=>readAtt(sid))){ UI.modal=null; toast('تم حفظ الحضور'); save(); } };
CM.complete=sid=>{
  const s=byId(C().sessions,sid); if(!s||s.status!=='scheduled') return;
  if(s.date>today()) return toast('لا يمكن إتمام حصة بتاريخ مستقبلي','err');
  const c=course(s.courseId); if(!c) return;
  if(tx(()=>{ readAtt(sid); s.status='completed'; s.completedAt=nowISO(); s.completedBy=who(); s.rate=c.rate; s.teacherId=c.teacherId; s.hours=sHours(s.start,s.end); })){
    addNotif('checkout','اكتملت حصة «'+c.name+'» — '+s.hours+' ساعة'); done('تم إتمام الحصة واحتساب '+s.hours+' ساعة');
  }
};
CM.askRevert=sid=>ask('إرجاع الحصة إلى مجدولة','ستُخصم ساعاتها من مستحقات المعلم.','إرجاع',"CM.revert('"+sid+"')");
CM.revert=sid=>{
  const s=byId(C().sessions,sid); if(!s||s.status!=='completed') return;
  const k=tStats(s.teacherId);
  if(k.earned-sessEarn(s)<k.paid){ toast('لا يمكن: المعلم استلم مبالغ تغطي هذه الحصة','err'); return; }
  s.status='scheduled'; delete s.rate; delete s.teacherId; delete s.completedAt; toast('تم الإرجاع'); save();
};

CM.doPostpone=sid=>{
  const s=byId(C().sessions,sid); if(!s||s.status!=='scheduled') return toast('لا يمكن تأجيل هذه الحصة','err');
  let reason=val('pp_reason'); if(reason==='أخرى') reason=val('pp_other')||'أخرى';
  const nd=val('pp_date'), ns=val('pp_start'); if(!nd||!ns) return toast('أدخل التاريخ والوقت الجديدين','err');
  if(nd===s.date&&ns===s.start) return toast('اختر موعداً مختلفاً','err');
  const endMin=tm(ns)+Math.round(s.hours*60); if(endMin>=1440) return toast('وقت النهاية يتجاوز منتصف الليل','err');
  const ne=toHM(endMin), c=course(s.courseId), cf=conflicts(c,nd,ns,ne,s.id,s.room);
  if(cf.length) return toast(cf[0],'err');
  if(tx(()=>{ const n={id:uid('ss'),courseId:s.courseId,date:nd,start:ns,end:ne,hours:s.hours,room:s.room,status:'scheduled',rescheduledFrom:s.id,origDate:s.origDate||s.date,origStart:s.origStart||s.start,createdAt:nowISO(),by:who()};
    C().sessions.push(n); s.status='postponed'; s.reason=reason; s.movedTo=n.id; s.postponedAt=nowISO(); s.postponedBy=who();
    C().logs.push({id:uid('lg'),sessionId:s.id,newSessionId:n.id,action:'postpone',fromDate:s.date,fromStart:s.start,toDate:nd,toStart:ns,reason,by:who(),at:nowISO()}); })){
    addNotif('booking','تأجيل حصة «'+c.name+'» من '+fD(s.date)+' إلى '+fD(nd)+' '+ns+' ('+reason+')'); done('تم التأجيل وتحديث الجدول');
  }
};

const RT=[['coursePerf','أداء كورس','c'],['students','قائمة تسجيل الطلاب','c'],['attendance','حضور الطلاب','c'],['teacherHours','ساعات عمل معلم','t'],['teacherStatement','كشف حساب معلم','t'],['courseFinance','إيرادات ومصروفات كورس','c'],['outstanding','المدفوعات المتأخرة للطلاب','co'],['overall','التقرير المالي الشامل','']];
const inR=(d,f,t)=>!(f&&d<f)&&!(t&&d>t);
function buildReport(r){
  const c=C(), P=r.param, f=r.from, to=r.to, secs=[], meta=[];
  const rng=(f||to)?'الفترة: '+(f?fD(f):'البداية')+' إلى '+(to?fD(to):'اليوم'):'كل الفترات';
  const type=r.type, cr=P&&course(P), tc=P&&teacher(P);
  let title=(RT.find(x=>x[0]===type)||[0,''])[1];
  if(type==='coursePerf'||type==='students'||type==='attendance'||type==='courseFinance'){
    if(!cr) return {title,meta:['اختر الكورس'],sections:[]};
    title+=' — '+cr.name; const k=cStats(cr.id), en=enrollsOf(cr.id,true);
    if(type==='coursePerf'){
      const recs=c.att.filter(a=>en.some(e=>e.id===a.enrollId)), pr=recs.filter(a=>a.status==='present').length;
      secs.push({title:'ملخص',head:['البند','القيمة'],rows:[['المعلم',(teacher(cr.teacherId)||{}).name||'—'],['المادة',cr.subject||'—'],['الحالة',CS[cr.status][0]],['الفترة',fD(cr.startDate)+' → '+fD(cr.endDate)],['عدد الطلاب',k.students],['الحصص المجدولة',k.scheduled],['المكتملة',k.completed],['المؤجلة',k.postponed],['الملغاة',k.cancelled],['ساعات التدريس المنفذة',k.hours],['متوسط الحضور',recs.length?Math.round(pr/recs.length*100)+'%':'—'],['الإيراد المتوقع',money(k.expected)],['المحصّل',money(k.collected)],['المتبقي على الطلاب',money(k.outstanding)],['مستحقات المعلم',money(k.earned)],['صافي الربح',money(k.net)]]});
      secs.push({title:'الحصص',head:['التاريخ','الوقت','الساعات','القاعة','الحالة'],rows:c.sessions.filter(s=>s.courseId===cr.id).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>[fD(s.date),s.start+' – '+s.end,s.hours,s.room||'—',SS[s.status][0]])});
    } else if(type==='students'){
      secs.push({title:'الطلاب المسجلون',head:['#','الاسم','الجوال','تاريخ التسجيل','الرسوم','المدفوع','المتبقي','الدفع','الحالة'],rows:en.map((e,i)=>[i+1,stName(e),stPhone(e),fD(e.regDate),money(e.fee),money(paidOfEn(e.id)),money(e.status==='active'?Math.max(0,e.fee-paidOfEn(e.id)):0),e.status==='active'?PS[enPay(e)][0]:'—',ENS[e.status]])});
    } else if(type==='attendance'){
      secs.push({title:'حضور الطلاب',head:['الطالب','حاضر','غائب','بعذر','عدد المسجل','النسبة'],rows:en.map(e=>{const a=attPct(e.id);return [stName(e),a.present,a.absent,a.excused,a.total,a.pct===null?'—':a.pct+'%'];})});
    } else {
      secs.push({title:'ملخص مالي',head:['البند','المبلغ'],rows:[['الإيراد المتوقع',money(k.expected)],['المحصّل فعلياً',money(k.collected)],['المتبقي على الطلاب',money(k.outstanding)],['مستحقات المعلم (مستحقة)',money(k.earned)],['المدفوع للمعلم',money(k.tpaid)],['التزامات المعلم المتبقية',money(k.liab)],['مصروفات أخرى',money(k.exp)],['صافي الربح (المحصّل − مدفوعات المعلم − المصروفات)',money(k.net)]]});
      const ids=en.map(e=>e.id);
      secs.push({title:'مدفوعات الطلاب',head:['التاريخ','الطالب','المبلغ','الطريقة'],rows:c.sPays.filter(p=>ids.indexOf(p.enrollId)>=0).sort((a,b)=>a.date.localeCompare(b.date)).map(p=>[fD(p.date),stName(byId(c.enrolls,p.enrollId)),money(p.amount),p.method||''])});

    }
  } else if(type==='teacherHours'||type==='teacherStatement'){
    if(!tc) return {title,meta:['اختر المعلم'],sections:[]};
    title+=' — '+tc.name; meta.push('الجوال: '+tc.phone+' · التخصص: '+(tc.subject||'—')); meta.push(rng);

    if(type==='teacherStatement'){
      const ps=c.tPays.filter(p=>p.teacherId===tc.id&&inR(p.date,f,to)).sort((a,b)=>a.date.localeCompare(b.date)), pt=r2(ps.reduce((a,p)=>a+p.amount,0)), k=tStats(tc.id);
      secs.push({title:'المدفوعات',head:['التاريخ','المبلغ','الطريقة','ملاحظات'],rows:ps.map(p=>[fD(p.date),money(p.amount),p.method||'',p.notes||'']),foot:['الإجمالي',money(pt),'','']});
      secs.push({title:'الخلاصة',head:['البند','المبلغ'],rows:[['مستحق الفترة',money(earned)],['مدفوع الفترة',money(pt)],['الرصيد المتبقي الكلي (كل الفترات)',money(k.bal)]]});
    }
  } else if(type==='outstanding'){
    meta.push(cr?'الكورس: '+cr.name:'كل الكورسات');
    const rows=c.enrolls.filter(e=>e.status==='active'&&e.fee-paidOfEn(e.id)>0&&(!cr||e.courseId===cr.id)).map(e=>[(course(e.courseId)||{}).name||'',stName(e),stPhone(e),e.fee,paidOfEn(e.id),r2(e.fee-paidOfEn(e.id))]);
    secs.push({title:'الطلاب غير المسددين',head:['الكورس','الطالب','الجوال','الرسوم','المدفوع','المتبقي'],rows:rows.map(x=>[x[0],x[1],x[2],money(x[3]),money(x[4]),money(x[5])]),foot:['الإجمالي','','','','',money(rows.reduce((a,x)=>a+x[5],0))]});
  } else {
    const cs=c.courses.map(x=>({x,k:cStats(x.id)})), sm=k=>money(cs.reduce((a,y)=>a+y.k[k],0));
    secs.push({title:'الكورسات',head:['الكورس','المتوقع','المحصّل','المتبقي','مستحق المعلم','مدفوع للمعلم','مصروفات','صافي الربح'],rows:cs.map(y=>[y.x.name,money(y.k.expected),money(y.k.collected),money(y.k.outstanding),money(y.k.earned),money(y.k.tpaid),money(y.k.exp),money(y.k.net)]),foot:['الإجمالي',sm('expected'),sm('collected'),sm('outstanding'),sm('earned'),sm('tpaid'),sm('exp'),sm('net')]});
    secs.push({title:'المعلمون',head:['المعلم','الساعات','المستحق','المدفوع','المتبقي'],rows:c.teachers.map(t=>{const k=tStats(t.id);return [t.name,k.hours,money(k.earned),money(k.paid),money(k.bal)];})});
  }
  return {title,meta,sections:secs};
}

  return '<div class="panel"><div class="toolbar">'+sel('rp_type',RT.map(x=>[x[0],x[1]]),r.type,'onchange="CM.repChange(true)" style="width:auto;min-width:200px;padding:8px;"').replace('style="'+ST+'"','')
   +'<span id="rp_par"></span><input type="date" class="input-dark" id="rp_from" value="'+(r.from||'')+'" onchange="CM.repChange()" title="من"><input type="date" class="input-dark" id="rp_to" value="'+(r.to||'')+'" onchange="CM.repChange()" title="إلى">'
   +'<div style="display:flex;gap:6px;margin-right:auto;"><button class="btn btn-brass btn-sm" onclick="CM.repPrint()">🖨 طباعة / PDF</button><button class="btn btn-ghost-dark btn-sm" onclick="CM.repCSV()">⬇ CSV</button></div></div>'
   +'<div id="rp_out"></div></div>';
}
function repParam(){
  const r=S().rep, def=RT.find(x=>x[0]===r.type)[2];
  if(!def) return '';
  const opts=def==='t'?tOpts():cOpts(def==='co'?'كل الكورسات':'');
  return sel('rp_param',opts,r.param,'onchange="CM.repChange()" style="width:auto;min-width:180px;padding:8px;"').replace('style="'+ST+'"','');
}
CM.repChange=(typeChanged,init)=>{
  const r=S().rep;
  if(!init){ if(typeChanged) { r.type=val('rp_type'); r.param=''; } else if($('rp_param')) r.param=val('rp_param'); r.from=val('rp_from'); r.to=val('rp_to'); }
  if(typeChanged||init){ $('rp_par').innerHTML=repParam(); const p=$('rp_param'); if(p) p.value=r.param; }
  $('rp_out').innerHTML=repHTML(buildReport(r));
};
CM.repPrint=()=>printReport(buildReport(S().rep));
CM.repCSV=()=>{
  const rep=buildReport(S().rep), q=x=>'"'+String(x==null?'':x).replace(/[\u2066\u2069]/g,'').replace(/"/g,'""')+'"';
  let out='\uFEFF'+q(rep.title)+'\n';
  rep.sections.forEach(s=>{ out+='\n'+q(s.title)+'\n'+s.head.map(q).join(',')+'\n'+s.rows.map(r=>r.map(q).join(',')).join('\n')+'\n'; });
  const url=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8;'})), a=document.createElement('a'); a.href=url; a.download='تقرير-كورسات-'+today()+'.csv'; a.click(); URL.revokeObjectURL(url);
};
})();
</script>
  <script>
/* ===== تعديلات: إخفاء المبالغ + إصلاح صافي الربح + إضافة/حذف طالب ===== */
(function(){
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const $=id=>document.getElementById(id);
const val=id=>{const e=$(id);return e?String(e.value).trim():'';};
const ST='width:100%;padding:10px;border-radius:8px;', LB='color:#B7BAC4;';

/* ============ 1) إخفاء / إظهار المبالغ (نجوم) ============ */
const HK='ahlam_hide_money';
let HIDE=false; try{ HIDE=localStorage.getItem(HK)==='1'; }catch(e){}
const _kpi=kpi;
kpi=function(label,v){
  if(HIDE && typeof v==='string' && DB && DB.settings && v.indexOf(DB.settings.currency)>=0) v='*****';
  return _kpi(label,v);
};
App.toggleMoney=()=>{ HIDE=!HIDE; try{ localStorage.setItem(HK,HIDE?'1':'0'); }catch(e){} render(); };
const _ra=renderAdmin;
renderAdmin=function(){
  const h=_ra();
  const btn='<button class="btn btn-ghost-dark btn-sm" onclick="App.toggleMoney()">'+(HIDE?'👁 إظهار المبالغ':'🙈 إخفاء المبالغ')+'</button>';
  return h.replace('<span class="badge badge-green">',()=>btn+'<span class="badge badge-green">');
};

/* ============ 2) لوحة الرئيسية: فصل الإيرادات وإصلاح صافي الربح ============ */
pgDashboard=function(){
  const now=new Date();
  const visitsToday=DB.checkins.filter(c=>isSameDay(c.entryAt,todayISO())).length;
  const weekRange=periodRange('week'), monthRange=periodRange('month');
  const visitsWeek=DB.checkins.filter(c=>inRange(c.entryAt,weekRange)).length;
  const visitsMonth=DB.checkins.filter(c=>inRange(c.entryAt,monthRange)).length;
  const bookingsToday=DB.bookings.filter(b=>b.date===todayISO()).length;
  const upcoming=DB.bookings.filter(b=>b.date>todayISO()&&b.status!=='Cancelled').length;
  const revToday=revenueInRange({from:new Date(new Date().setHours(0,0,0,0)),to:now});
  const revWeek=revenueInRange(weekRange);
  const revMonthAll=revenueInRange(monthRange);                       // الحجوزات + الاشتراكات + المنتجات
  const productMonth=DB.orders.filter(o=>inRange(o.createdAt,monthRange)).reduce((s,o)=>s+o.total,0);
  const revMonth=revMonthAll-productMonth;                            // الحجوزات والاشتراكات فقط
  const monthKey=now.getFullYear()+'-'+p2(now.getMonth()+1);
  const monthExpenses=(DB.expenses||[]).filter(e=>String(e.date||'').slice(0,7)===monthKey).reduce((s,e)=>s+Number(e.amount||0),0);
  const netProfit=revMonth+productMonth-monthExpenses;                // بدون أي تكرار
  const usageHours=DB.checkins.filter(c=>c.status==='completed').reduce((s,c)=>s+(c.actualHours||0),0);
  const occRate=DB.seats.length?Math.round((currentlyInside().length/DB.seats.length)*100):0;
  const topProducts=[...DB.products].sort((a,b)=>b.sold-a.sold).slice(0,5);
  return `
  <div class="kpi-grid">
    ${kpi('زوار اليوم',visitsToday)}
    ${kpi('زوار هذا الأسبوع',visitsWeek)}
    ${kpi('زوار هذا الشهر',visitsMonth)}
    ${kpi('الموجودون حالياً',currentlyInside().length)}
    ${kpi('حجوزات اليوم',bookingsToday)}
    ${kpi('حجوزات قادمة',upcoming)}
    ${kpi('إيرادات اليوم',fmtMoney(revToday))}
    ${kpi('إيرادات الأسبوع',fmtMoney(revWeek))}
    ${kpi('إيرادات الشهر (حجوزات واشتراكات)',fmtMoney(revMonth))}
    ${kpi('مبيعات المنتجات (الشهر)',fmtMoney(productMonth))}
    ${kpi('المصروفات (الشهر)',fmtMoney(monthExpenses))}
    ${kpi('صافي ربح الشهر',fmtMoney(netProfit))}
    ${kpi('ساعات الاستخدام',Math.round(usageHours))}
    ${kpi('نسبة إشغال المقاعد',occRate+'%')}
  </div>
  <div class="panel" style="font-size:12.5px;color:var(--ink-soft);">صافي ربح الشهر = إيرادات الشهر (حجوزات واشتراكات) + مبيعات منتجات الشهر − مصروفات الشهر. إيرادات اليوم والأسبوع تشمل مبيعات المنتجات.</div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h3>الإيرادات آخر 7 أيام</h3></div><canvas id="chartRevenue" height="180"></canvas></div>
    <div class="panel"><div class="panel-h"><h3>المنتجات الأكثر مبيعاً</h3></div>
      ${topProducts.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);"><span>${p.emoji} ${esc(p.name)}</span><span class="badge badge-amber num">${p.sold} مباع</span></div>`).join('')||'<div class="empty">لا توجد مبيعات بعد</div>'}
    </div>
  </div>
  <div class="panel"><div class="panel-h"><h3>أحدث الحجوزات</h3><div style="display:flex;gap:8px;"><button class="btn btn-brass btn-sm" onclick="App.openNewBooking()">+ حجز جديد</button><a class="btn btn-ghost-dark btn-sm" onclick="App.goAdminPage('bookings')">عرض الكل</a></div></div>
    ${bookingTable(DB.bookings.slice(-6).reverse())}
  </div>`;
};

/* ============ 3) إضافة وحذف طالب (تبويب الطلاب في الكورسات) ============ */
const CMX=window.CMX={};
function decorate(html){
  return html
    .replace(/(<button class="btn btn-ghost-dark btn-sm" onclick="CM\.openStudent\('([^']+)'\)">تفاصيل<\/button>)/g,
      (m,btn,id)=>btn+' <button class="btn btn-danger btn-sm" onclick="CMX.askDelStudent(\''+id+'\')">حذف</button>');
}
const _rap=renderAdminPage;
renderAdminPage=function(staff){
  const h=_rap(staff);
  if(UI.adminPage==='courses'&&UI.cm&&UI.cm.tab==='students'&&!UI.cm.cid){
    return decorate(h).replace('oninput="CM.sSearch(this.value)"></div>',
      ()=>'oninput="CM.sSearch(this.value)"><button class="btn btn-brass btn-sm" style="margin-right:auto;" onclick="CMX.openAddStudent()">+ إضافة طالب</button></div>');
  }
  return h;
};
if(window.CM&&CM.sSearch){
  const _ss=CM.sSearch;
  CM.sSearch=v=>{ _ss(v); const e=$('cm_slist'); if(e) e.innerHTML=decorate(e.innerHTML); };
}

CMX.openAddStudent=()=>{ UI.modal={type:'cmx_addstu'}; render(); };
CMX.asFee=()=>{ const c=(DB.cm.courses||[]).find(x=>x.id===val('as_course')); $('as_fee').value=c?c.price:''; };
function addStuModal(){
  const cs=(DB.cm.courses||[]).filter(c=>!c.archived&&c.status!=='cancelled');
  const f=(l,h)=>'<div class="form-row"><label style="'+LB+'">'+l+'</label>'+h+'</div>';
  const i=(id,x)=>'<input class="input-dark" style="'+ST+'" id="'+id+'" '+(x||'')+'>';
  return '<div class="modal-bg"><div class="modal"><h3>إضافة طالب</h3>'
   +f('اسم الطالب',i('as_name'))+f('رقم الجوال',i('as_phone','type="tel"'))
   +f('تسجيله في كورس (اختياري)','<select class="input-dark" style="'+ST+'" id="as_course" onchange="CMX.asFee()"><option value="">بدون تسجيل في كورس الآن</option>'+cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' — '+c.price+' '+DB.settings.currency+'</option>').join('')+'</select>')
   +f('الرسوم (إذا اختير كورس)',i('as_fee','type="number" min="0"'))
   +'<div style="display:flex;gap:10px;margin-top:10px;"><button class="btn btn-brass" style="flex:1;justify-content:center;" onclick="CMX.saveStudent()">حفظ</button><button class="btn btn-ghost-dark" onclick="App.closeModal()">إلغاء</button></div></div></div>';
}
CMX.saveStudent=()=>{
  const name=val('as_name'), phone=val('as_phone').replace(/\s+/g,''), cid=val('as_course'), fee=parseFloat(val('as_fee'))||0;
  if(!name) return toast('اكتب اسم الطالب','err');
  if(phone.replace(/\D/g,'').length<7) return toast('أدخل رقم جوال صحيح','err');
  const c=DB.cm, ex=c.students.find(s=>s.phone===phone);
  if(ex) return toast('هذا الرقم مسجل باسم «'+ex.name+'» — استخدم زر "تسجيل في كورس" بجانبه','err');
  if(cid&&!c.courses.find(x=>x.id===cid)) return toast('الكورس غير موجود','err');
  if(fee<0) return toast('الرسوم غير صحيحة','err');
  const st={id:uid('stu'),name,phone,createdAt:new Date().toISOString()};
  c.students.push(st);
  if(cid) c.enrolls.push({id:uid('en'),courseId:cid,studentId:st.id,fee,regDate:ymd(new Date()),status:'active',createdAt:new Date().toISOString(),by:(currentStaff()||{}).name||''});
  UI.modal=null; toast('تمت إضافة الطالب'); save();
};
CMX.askDelStudent=id=>{
  const s=DB.cm.students.find(x=>x.id===id); if(!s) return;
  UI.modal={type:'confirm',title:'حذف طالب',text:'سيتم حذف «'+s.name+'» نهائياً مع تسجيلاته وسجل حضوره. لا يمكن الحذف إذا كانت له مدفوعات مسجلة.',confirmLabel:'حذف',onConfirm:"()=>{CMX.delStudent('"+id+"')}"};
  render();
};
CMX.delStudent=id=>{
  const c=DB.cm, en=c.enrolls.filter(e=>e.studentId===id).map(e=>e.id);
  if(c.sPays.some(p=>en.indexOf(p.enrollId)>=0)) return toast('للطالب مدفوعات مسجلة — احذف دفعاته أولاً (من مالية الكورس) أو أزله من الكورس بدل الحذف','err');
  c.att=c.att.filter(a=>en.indexOf(a.enrollId)<0);
  c.enrolls=c.enrolls.filter(e=>e.studentId!==id);
  c.students=c.students.filter(s=>s.id!==id);
  toast('تم حذف الطالب'); save();
};

const _rm=renderModal;
renderModal=function(){
  if(UI.modal&&UI.modal.type==='cmx_addstu'){ const h=document.createElement('div'); document.body.appendChild(h); h.outerHTML=addStuModal(); return; }
  _rm();
};
})();
</script>
